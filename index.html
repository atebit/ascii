.layer-2 .s2-read { position: absolute; left: 0; top: 0; z-index: 2; display: grid; grid-template-columns: repeat(4, auto);
  align-items: baseline; column-gap: .8em; row-gap: .9em; font: var(--rf)/1 var(--arcade); white-space: nowrap;
  text-shadow: 0 0 4px #000, 0 0 10px #000; }
.layer-2.go .s2-read { animation: s2-fade .6s .7s both; }
.layer-2 .s2-kind { grid-column: 1 / -1; font-size: max(8px, calc(var(--rf) * .55)); letter-spacing: .12em; }
.layer-2 .s2-arrow, .layer-2 .s2-dot { color: var(--dim); font-family: var(--mono); font-size: calc(var(--rf) * 1.3); }
.layer-2 .s2-num { color: var(--ink); min-width: 3em; text-align: right; text-shadow: 0 0 10px var(--hot); }
.layer-2 .s2-bits b { font-weight: normal; color: #5a5466; }
.layer-2 .s2-bits b.one { color: var(--gold); text-shadow: 0 0 8px var(--gold); }
.layer-2 .s2-bits.ext { color: var(--hot); font-size: calc(var(--rf) * .7); text-shadow: 0 0 8px var(--hot); }
.layer-2 .s2-lab { color: var(--dim); font-size: max(7px, calc(var(--rf) * .5)); letter-spacing: .12em; }
.layer-2 .s2-lab.r { text-align: right; }
.layer-2 .s2-fly { position: absolute; width: 1em; height: 1.2em; margin: -0.6em 0 0 -0.5em; text-align: center;
  font: 700 var(--gfs)/1.2em var(--mono); z-index: 5; pointer-events: none; will-change: transform, opacity;
  text-shadow: 0 0 10px currentColor, 0 0 26px currentColor; }
.layer-2 .s2-copy { position: absolute; left: 16px; right: 16px; bottom: 64px; z-index: 4; display: flex;
  flex-direction: column; align-items: center; gap: var(--cg); text-align: center; pointer-events: none;
  text-shadow: 0 0 4px #000, 0 0 12px #000; }
.layer-2 .s2-msg { font: var(--mf)/1.7 var(--arcade); color: var(--ink); max-width: 46em; }
.layer-2 .s2-msg .w { color: var(--gold); text-shadow: 0 0 10px var(--gold); }
.layer-2 .s2-msg .rest { color: transparent; text-shadow: none; }
.layer-2 .s2-msg .cur { color: var(--hot); }
.layer-2 .s2-fact { position: relative; font: var(--ff)/1.6 var(--arcade); color: var(--cyan); pointer-events: auto; cursor: help;
  text-shadow: 0 0 8px #4be3f088, 0 0 4px #000; }
.layer-2.go .s2-fact { animation: s2-fade .6s 2.6s both; }
.layer-2 .s2-fact .star { color: var(--gold); }
.layer-2 .s2-foot { position: absolute; left: 50%; bottom: calc(100% + var(--cg)); width: min(34em, calc(100vw - 32px));
  transform: translateX(-50%); font: 12px/1.5 var(--mono); color: var(--ink); opacity: 0; transition: opacity .2s;
  pointer-events: none; }
.layer-2 .s2-copy.foot .s2-foot { opacity: 1; }
.layer-2 .s2-hint { display: flex; flex-direction: column; align-items: center; gap: .55em; color: var(--gold);
  font-family: var(--arcade); font-size: min(clamp(18px, 3vw, 36px), calc((100vw - 32px) / 21)); }
.layer-2.go .s2-hint { animation: s2-fade .6s 1.6s both; }
.layer-2 .s2-hint .h1 { display: block; line-height: 1.2; white-space: nowrap; letter-spacing: .04em;
  text-shadow: 0 0 6px #ffc53d, 0 0 18px #ffc53d99, 0 0 36px #ff8a3d66, 0 0 4px #000; will-change: transform; }
.layer-2.go:not(.calm) .s2-hint .h1 { animation: s2-call 1.2s 2.2s ease-in-out infinite; }
.layer-2 .s2-hint .h2 { display: block; font-size: max(8px, .4em); line-height: 1.6; color: var(--cyan);
  text-shadow: 0 0 8px #4be3f088, 0 0 4px #000; }
@keyframes s2-call { 0%, 100% { transform: scale(1); color: var(--gold); }
  50% { transform: scale(1.07); color: #fff2c4; } 52% { opacity: .6; } 56% { opacity: 1; } }
.layer-2 .s2-copy.foot .s2-msg { visibility: hidden; }
.layer-2 .s2-input { position: absolute; left: 50%; top: 50%; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0;
  font-size: 16px; pointer-events: none; }
@keyframes s2-pop { from { transform: scale(0) rotate(-20deg); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes s2-punch { 0% { transform: scale(1.5); } 100% { transform: none; } }
@keyframes s2-breathe { 50% { opacity: .7; } }
@keyframes s2-fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes s2-blink { 0%, 100% { opacity: 1; } 55% { opacity: .25; } }
`;
    document.head.appendChild(style);
  }

  // ---------- DOM ----------
  const root = ctx.layer;
  root.innerHTML = '';
  const orbit = el('div', 's2-orbit');
  const ring = [];
  for (let i = 0; i < N; i++) {
    const code = FIRST + i;
    const ch = String.fromCharCode(code);
    const e = el('span', `s2-ch k-${kind(code)[0]}`);
    e.textContent = show(ch);
    orbit.appendChild(e);
    ring.push({ el: e, code, ch, base: (i / N) * TAU, front: null, hi: false, gone: -9, d: 0 });
  }
  const tile = el('div', 's2-tile');
  const tileBox = el('div', 's2-tilebox');
  const frame = el('pre', 's2-frame');
  frame.textContent = ['╔═════════╗', '║         ║', '║         ║', '║         ║', '╚═════════╝'].join('\n');
  const glyph = el('div', 's2-glyph k-up');
  tileBox.append(frame, glyph);
  tile.appendChild(tileBox);
  const read = el('div', 's2-read');
  const kindEl = el('span', 's2-kind k-up');
  const arrow = el('span', 's2-arrow', '◂');
  const numEl = el('span', 's2-num');
  const dot = el('span', 's2-dot', '·');
  const bitsEl = el('span', 's2-bits');
  const numLab = el('span', 's2-lab r', 'NUMBER');
  const bitsLab = el('span', 's2-lab', '8 BITS');
  read.append(kindEl, arrow, numEl, dot, bitsEl, el('span'), numLab, el('span'), bitsLab);
  orbit.append(tile, read);

  const copy = el('div', 's2-copy');
  const msg = el('div', 's2-msg');
  const fact = el('div', 's2-fact');
  fact.innerHTML = '128 CODES · 95 YOU CAN SEE · SINCE 1963 <span class="star">*</span>';
  const foot = el('div', 's2-foot');
  foot.textContent = FOOT;
  fact.appendChild(foot);
  const hint = el('div', 's2-hint');
  const hint1 = el('span', 'h1');
  const hint2 = el('span', 'h2');
  hint.append(hint1, hint2);
  const setHint = ([a, b]) => { hint1.textContent = a; hint2.textContent = b; };
  setHint(HINT);
  copy.append(msg, fact, hint);

  const input = el('input', 's2-input');
  input.type = 'text';
  input.setAttribute('aria-label', 'Type a character');
  for (const [k, v] of [['autocapitalize', 'off'], ['autocomplete', 'off'], ['autocorrect', 'off'], ['spellcheck', 'false']]) input.setAttribute(k, v);
  root.append(orbit, copy, input);

  // ---------- three.js background: star field and an octagon tunnel ----------
  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x000000, 10, 110);
  const camera = new THREE.PerspectiveCamera(70, 1, 0.1, 400);
  const STAR_DEPTH = 240;
  const stars = makeStars({ count: 1400, spread: 200, depth: STAR_DEPTH });
  scene.add(stars);
  const starPos = stars.geometry.attributes.position;
  const tunnel = new THREE.Group();
  scene.add(tunnel);
  const T_N = 12;
  const T_GAP = 13;
  const T_DEPTH = T_N * T_GAP;
  const T_R = 26;
  const ringGeo = new THREE.TorusGeometry(T_R, 0.45, 4, 8);
  const ringCols = [PALETTE.hot, PALETTE.violet, PALETTE.cyan, PALETTE.violet];
  const rings = [];
  for (let i = 0; i < T_N; i++) {
    const base = new THREE.Color(ringCols[i % ringCols.length]);
    const m = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: base.clone() }));
    m.position.z = -4 - i * T_GAP;
    m.userData.base = base;
    rings.push(m);
    tunnel.add(m);
  }
  const strutGeo = new THREE.BoxGeometry(0.35, 0.35, T_DEPTH);
  const strutMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(PALETTE.violet).multiplyScalar(0.22) });
  for (let k = 0; k < 8; k++) {
    const a = (k / 8) * TAU;
    const s = new THREE.Mesh(strutGeo, strutMat);
    s.position.set(Math.cos(a) * T_R, Math.sin(a) * T_R, -T_DEPTH / 2 + 4);
    tunnel.add(s);
  }

  // ---------- state ----------
  const tried = new Set();
  let R = 300, P = 1200, tilt0 = 18, fs = 20, side = true;
  let spin = 0, kick = 0, pulse = 0, tNow = 0, dirty = true;
  let userPressed = false, nextDemo = 2, typed = -1, done = false;
  let cur = null; // { code, t0 }
  let shownV = -1;
  const flights = [];

  function setGlyph(ch, code) {
    const [k, label] = kind(code);
    glyph.className = `s2-glyph k-${k}`;
    glyph.textContent = show(ch);
    kindEl.className = `s2-kind k-${k}`;
    kindEl.textContent = label;
    const ext = code > 127;
    bitsEl.classList.toggle('ext', ext);
    bitsLab.textContent = ext ? 'PAST 127' : '8 BITS';
    cur = { code, t0: tNow };
    shownV = -1;
  }

  function drawNum(v) {
    numEl.textContent = String(v);
    if (cur.code > 127) { bitsEl.textContent = 'NOT ASCII'; return; }
    const b = v.toString(2).padStart(8, '0');
    let h = '';
    for (const c of b) h += c === '1' ? '<b class="one">1</b>' : '<b>0</b>';
    bitsEl.innerHTML = h;
  }

  function layout() {
    const W = window.innerWidth;
    const H = window.innerHeight;
    const small = W < 700;
    const s = root.style;
    s.setProperty('--tf', `${small ? 15 : 18}px`);
    s.setProperty('--rf', `${small ? 12 : 16}px`);
    s.setProperty('--mf', `${small ? 9 : W < 1100 ? 12 : 14}px`);
    s.setProperty('--ff', `${small ? 8 : 10}px`);
    s.setProperty('--cg', `${small ? 14 : 20}px`);
    const bottomPad = small ? 82 : 84;
    copy.style.bottom = `${bottomPad}px`;
    const top = small ? 40 : 54;
    const tileW = tileBox.offsetWidth;
    const tileH = tileBox.offsetHeight;
    const readW = read.offsetWidth;
    const readH = read.offsetHeight;
    root.style.setProperty('--gfs', `${glyph.getBoundingClientRect().height ? parseFloat(getComputedStyle(glyph).fontSize) : 50}px`);
    let bottom = H - bottomPad - copy.offsetHeight - (small ? 14 : 24);
    R = Math.min(W * (small ? 0.44 : 0.38), 480);
    side = R - tileW / 2 - 28 >= readW;
    const below = side ? 0 : readH + 18;
    let front, back;
    for (let guard = 0; guard < 30; guard++) {
      fs = clamp((R * TAU) / N * 0.95, 12, 28);
      P = R * 4;
      tilt0 = clamp((Math.asin(clamp((tileH / 2 + fs * 0.9) / R, 0, 0.9)) * 180) / Math.PI, 12, 30);
      // Tall, narrow screens have room to spare: open the ring up so it reads as 3D.
      if (H / W > 1.4) tilt0 = Math.max(tilt0, 26);
      const st = Math.sin(((tilt0 + 5) * Math.PI) / 180);
      front = R * st * (P / (P - R)) + fs;
      back = Math.max(R * st * (P / (P + R)) + fs, tileH / 2 + 4);
      if (front + back + below <= bottom - top || R < 110) break;
      R *= 0.93;
    }
    s.setProperty('--rfs', `${fs}px`);
    const cy = Math.round((top + back + bottom - front - below) / 2);
    orbit.style.left = `${Math.round(W / 2)}px`;
    orbit.style.top = `${cy}px`;
    if (side) {
      arrow.textContent = '◂';
      read.style.left = `${Math.round(tileW / 2 + 24)}px`;
      read.style.top = `${Math.round(-readH / 2 + 4)}px`;
    } else {
      arrow.textContent = '▴';
      read.style.left = `${Math.round(-readW / 2)}px`;
      read.style.top = `${Math.round(front + 14)}px`;
    }
    dirty = false;
  }

  function fly(ch, code, from, onLand) {
    const to = glyph.getBoundingClientRect();
    const box = root.getBoundingClientRect();
    const tx = to.left + to.width / 2 - box.left;
    const ty = to.top + to.height / 2 - box.top;
    const fx = from.left + from.width / 2 - box.left;
    const fy = from.top + from.height / 2 - box.top;
    const gfs = parseFloat(getComputedStyle(glyph).fontSize) || 50;
    const s0 = clamp(from.height / (gfs * 1.2), 0.08, 1);
    const dx = fx - tx;
    const dy = fy - ty;
    const lift = 50 + Math.abs(dx) * 0.2;
    const frames = [
      { transform: `translate(${dx}px,${dy}px) scale(${s0})` },
      { transform: `translate(${dx * 0.4}px,${dy * 0.4 - lift}px) scale(${0.9}) rotate(${dx > 0 ? 14 : -14}deg)`, offset: 0.5 },
      { transform: 'translate(0,0) scale(1)' },
    ];
    const opts = { duration: 560, easing: 'cubic-bezier(.45,0,.25,1)', fill: 'both' };
    const cls = `s2-fly k-${kind(code)[0]}`;
    [0.4, 0.22, 0.1].forEach((op, j) => {
      const g = el('span', cls);
      g.textContent = show(ch);
      Object.assign(g.style, { left: `${tx}px`, top: `${ty}px`, opacity: op });
      root.appendChild(g);
      const a = g.animate(frames, { ...opts, delay: 40 * (j + 1) });
      a.onfinish = () => g.remove();
      flights.push({ el: g, anim: a });
    });
    const f = el('span', cls);
    f.textContent = show(ch);
    Object.assign(f.style, { left: `${tx}px`, top: `${ty}px` });
    root.appendChild(f);
    const a = f.animate(frames, opts);
    a.onfinish = () => { f.remove(); onLand(); };
    flights.push({ el: f, anim: a });
    while (flights.length && !flights[0].el.isConnected) flights.shift();
  }

  function clearFlights() {
    for (const f of flights) { f.anim.onfinish = null; f.anim.cancel(); f.el.remove(); }
    flights.length = 0;
  }

  function land(ch, code, user) {
    setGlyph(ch, code);
    tile.classList.remove('hit');
    void tile.offsetWidth;
    tile.classList.add('hit');
    clearTimeout(land.timer);
    land.timer = setTimeout(() => tile.classList.remove('hit'), 260);
    ctx.sfx('blip');
    if (user && code >= FIRST && code <= LAST && !tried.has(code)) {
      tried.add(code);
      ctx.score.chars = tried.size;
      ring[code - FIRST].el.classList.add('t');
      if (tried.size === N && !done) {
        done = true;
        setHint(HINT_DONE);
        ctx.sfx('coin');
      }
    }
  }

  function press(ch, user = true) {
    const code = ch.codePointAt(0);
    if (user && !userPressed) { userPressed = true; root.classList.add('calm'); }
    let from;
    if (code >= FIRST && code <= LAST) {
      const c = ring[code - FIRST];
      from = c.el.getBoundingClientRect();
      if (from.width === 0) from = { left: window.innerWidth / 2, top: 0, width: 20, height: 24 };
      c.gone = tNow;
    } else {
      from = { left: window.innerWidth / 2 - 20, top: window.innerHeight + 20, width: 40, height: 48 };
    }
    ctx.sfx('type');
    kick += 1.4;
    pulse = 1;
    fly(ch, code, from, () => land(ch, code, user));
  }

  function pickAt(x, y) {
    let best = null;
    let bd = 36 * 36;
    for (const c of ring) {
      if (c.d < -0.35) continue;
      const r = c.el.getBoundingClientRect();
      const dx = r.left + r.width / 2 - x;
      const dy = r.top + r.height / 2 - y;
      const dd = dx * dx + dy * dy;
      if (dd < bd) { bd = dd; best = c; }
    }
    return best;
  }

  // ---------- input ----------
  root.addEventListener('pointerdown', (e) => {
    if (fact.contains(e.target)) {
      if (e.pointerType !== 'mouse') copy.classList.toggle('foot');
      return;
    }
    copy.classList.remove('foot');
    if (tile.contains(e.target)) {
      if (touch) input.focus({ preventScroll: true });
      return;
    }
    const c = pickAt(e.clientX, e.clientY);
    if (c) press(c.ch);
  });
  fact.addEventListener('pointerenter', (e) => { if (e.pointerType === 'mouse') copy.classList.add('foot'); });
  fact.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') copy.classList.remove('foot'); });
  input.addEventListener('input', () => {
    const v = [...input.value];
    input.value = '';
    if (v.length) press(v[v.length - 1]);
  });
  window.addEventListener('resize', () => { dirty = true; });
  if (document.fonts?.ready) document.fonts.ready.then(() => { dirty = true; });

  function typeMsg(n) {
    if (n === typed) return;
    typed = n;
    const word = 'CHARACTERS';
    const w0 = MSG.indexOf(word);
    const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
    const vis = MSG.slice(0, n);
    let h;
    if (n > w0) {
      const w1 = Math.min(n, w0 + word.length);
      h = esc(vis.slice(0, w0)) + `<span class="w">${esc(vis.slice(w0, w1))}</span>` + esc(vis.slice(w1));
    } else h = esc(vis);
    if (n < MSG.length) h += `<span class="cur">█</span><span class="rest">${esc(MSG.slice(n + 1))}</span>`;
    msg.innerHTML = h;
  }

  return {
    scene,
    camera,
    enter() {
      ctx.setAscii({ fill: 0.15, edges: false });
      clearFlights();
      copy.classList.remove('foot');
      root.classList.remove('go');
      void root.offsetWidth;
      root.classList.add('go');
      spin = -0.9;
      kick = 0;
      pulse = 0.6;
      typed = -1;
      typeMsg(0);
      nextDemo = 2;
      userPressed = false;
      root.classList.remove('calm');
      for (const c of ring) { c.gone = -9; c.front = null; c.hi = false; c.el.classList.remove('hi'); c.el.style.opacity = 0; }
      setGlyph('A', 65);
      cur.t0 = 0.4;
      dirty = true;
      layout();
    },
    exit() {
      input.blur();
      clearFlights();
    },
    update(t, dt) {
      tNow = t;
      if (dirty) layout();

      // Ring: spin fast on entry, then settle into a slow drift; key presses kick it.
      kick *= Math.exp(-dt * 2.5);
      spin -= dt * (0.12 + 2.6 * Math.exp(-t * 1.6) + kick);
      const tilt = tilt0 + 5 * Math.sin(t * 0.35);
      const wob = 4 * Math.sin(t * 0.23);
      const grow = 0.35 + 0.65 * easeOut(clamp(t / 1.3));
      const r = R * grow;
      const pre = `perspective(${P.toFixed(0)}px) rotateZ(${wob.toFixed(2)}deg) rotateX(${(-tilt).toFixed(2)}deg) rotateY(`;
      const post = `rotateX(${tilt.toFixed(2)}deg) rotateZ(${(-wob).toFixed(2)}deg) scale(`;
      for (let i = 0; i < N; i++) {
        const c = ring[i];
        const th = c.base + spin;
        const d = Math.cos(th);
        c.d = d;
        const intro = clamp((t - 0.1 - i * 0.012) / 0.4);
        const back = c.gone < 0 ? 1 : clamp((t - c.gone - 0.8) / 0.5);
        const f = clamp((d - 0.86) / 0.14);
        const sc = (intro < 1 ? easeBack(intro) : 1) * (1 + 0.7 * f) * (0.5 + 0.5 * back);
        const op = (0.14 + 0.86 * ((d + 1) / 2) ** 2.2) * (c.el.classList.contains('t') ? 1 : 0.82) * Math.min(1, intro * 2) * back;
        const a = th.toFixed(4);
        c.el.style.transform = `${pre}${a}rad) translateZ(${r.toFixed(1)}px) rotateY(${-a}rad) ${post}${sc.toFixed(3)})`;
        c.el.style.opacity = op.toFixed(3);
        const front = d >= 0;
        if (front !== c.front) { c.front = front; c.el.style.zIndex = front ? 3 : 1; }
        const hi = f > 0.35 && back > 0.9;
        if (hi !== c.hi) { c.hi = hi; c.el.classList.toggle('hi', hi); }
      }

      // Tile readout counts up from 0 to the code.
      if (cur) {
        const p = clamp((t - cur.t0) / 0.75);
        const v = Math.round(cur.code * easeOut(p));
        if (v !== shownV) { shownV = v; drawNum(v); }
      }

      // Copy types in, then a demo character flies in until the player presses a key.
      typeMsg(Math.floor(clamp((t - 0.9) * 34, 0, MSG.length)));
      if (!userPressed && t >= nextDemo) {
        nextDemo = t + 4.5;
        const pool = 'AaZz09?@#&{}~';
        const ch = t < 3 ? 'A' : pool[Math.floor(Math.random() * pool.length)];
        press(ch, false);
      }

      // Background: stars stream past, the tunnel rushes forward and flares on each key.
      pulse *= Math.exp(-dt * 2.2);
      const speed = 7 + 45 * pulse;
      const arr = starPos.array;
      for (let i = 2; i < arr.length; i += 3) {
        arr[i] += speed * 1.6 * dt;
        if (arr[i] > 1) arr[i] -= STAR_DEPTH;
      }
      starPos.needsUpdate = true;
      const glow = 0.2 + 0.8 * pulse;
      for (const m of rings) {
        m.position.z += speed * dt;
        if (m.position.z > 2) m.position.z -= T_DEPTH;
        m.material.color.copy(m.userData.base).multiplyScalar(glow);
      }
      tunnel.rotation.z = t * 0.06;
      camera.position.set(Math.sin(t * 0.21) * 1.6, Math.cos(t * 0.17) * 1.1, 0);
      camera.rotation.z = Math.sin(t * 0.3) * 0.05;
    },
    onKey(e) {
      if (e.key.length !== 1) return false;
      if (!e.repeat) press(e.key);
      return true;
    },
    hud: () => ({ tl: 'STAGE 02 · WHAT IS ASCII?', tr: `CHARS ${String(tried.size).padStart(6, '0')}` }),
  };
};

// Stage 3: How can it be super sick? The 3 clay cats as a real 3D scene drawn in characters.
// Drag to orbit, scroll or pinch to zoom, click a cat, R cycles the render mode.
STAGES[3] = (ctx) => {
  const MODES = ['SHADED', 'WIREFRAME', 'FALLING CODE'];
  const POPS = { pink: ['mrrp! ♥', 'var(--hot)'], orange: ['!?', 'var(--orange)'], grey: ['...mrrp?', 'var(--ink)'] };
  const MSG = 'SAME 95 CHARACTERS. ADD DEPTH, LIGHT AND TIME.';
  const touch = matchMedia('(pointer: coarse)').matches;
  const BASE_TAN = Math.tan(THREE.MathUtils.degToRad(16)); // 32 degree vertical FOV
  const MIN_HALF_W = 0.23; // keep at least this much half-width (as tan) so the stack fits on phones

  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x000000, 11, 26); // only the floor grid uses it: a depth cue
  const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 400);
  scene.add(camera); // the camera carries the code rain

  // Lighting from the cat lab.
  scene.add(new THREE.HemisphereLight(0xffffff, 0xd9a08f, 2.0));
  const key = new THREE.DirectionalLight(0xffffff, 2.8);
  key.position.set(3, 6, 6);
  key.castShadow = true;
  key.shadow.mapSize.set(1024, 1024);
  Object.assign(key.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4 });
  key.shadow.radius = 6;
  scene.add(key);
  const rim = new THREE.DirectionalLight(0xffd6e4, 1.2);
  rim.position.set(-5, 3, -5);
  scene.add(rim);

  // The turntable: the cats plus a polar grid that turns with them.
  const turntable = new THREE.Group();
  scene.add(turntable);
  const kit = buildCats();
  kit.root.traverse((o) => { if (o.material) o.material.fog = false; });
  turntable.add(kit.root);

  const gridPts = [];
  const ring = (r) => {
    for (let i = 0; i < 64; i++) {
      const a = (i / 64) * Math.PI * 2;
      const b = ((i + 1) / 64) * Math.PI * 2;
      gridPts.push(Math.cos(a) * r, 0, Math.sin(a) * r, Math.cos(b) * r, 0, Math.sin(b) * r);
    }
  };
  [2.8, 4.6, 7].forEach(ring);
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2;
    gridPts.push(Math.cos(a) * 2.8, 0, Math.sin(a) * 2.8, Math.cos(a) * 7, 0, Math.sin(a) * 7);
  }
  const gridGeo = new THREE.BufferGeometry();
  gridGeo.setAttribute('position', new THREE.Float32BufferAttribute(gridPts, 3));
  // No depth write, so the lines skip the thick silhouette edges; ridges draws them as / - \\ |.
  const grid = new THREE.LineSegments(gridGeo, new THREE.LineBasicMaterial({
    color: new THREE.Color(PALETTE.violet).multiplyScalar(0.28), depthWrite: false,
  }));
  grid.position.y = -1.9;
  turntable.add(grid);

  // Stars on a shell all the way round, so every orbit angle has some.
  const stars = makeStars({ count: 1400 });
  const sp = stars.geometry.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < sp.count; i++) {
    v.randomDirection().multiplyScalar(45 + Math.random() * 70);
    sp.setXYZ(i, v.x, v.y, v.z);
  }
  stars.material.depthWrite = false; // brightness glyphs, not edge glyphs
  stars.material.fog = false;
  scene.add(stars);

  // Falling green code: drops of points snapped to the character grid, carried by the camera.
  const RAIN_MAX = 3200;
  const RAIN_D = 60;
  const rainPos = new Float32Array(RAIN_MAX * 3);
  const rainCol = new Float32Array(RAIN_MAX * 3);
  const rainGeo = new THREE.BufferGeometry();
  rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
  rainGeo.setAttribute('color', new THREE.BufferAttribute(rainCol, 3));
  const rain = new THREE.Points(rainGeo, new THREE.PointsMaterial({
    size: 2, sizeAttenuation: false, vertexColors: true, depthWrite: false, fog: false,
  }));
  rain.frustumCulled = false;
  rain.position.z = -RAIN_D;
  rain.visible = false;
  camera.add(rain);
  const drops = [];
  const newDrop = (cols, rows, d = {}, spread = false) => Object.assign(d, {
    c: Math.floor(Math.random() * cols),
    y: spread ? Math.random() * rows : -Math.random() * rows * 0.4,
    v: 7 + Math.random() * 20,
    len: 6 + Math.floor(Math.random() * 20),
  });

  function rainStep(t, dt) {
    const { cols, rows } = ctx.ascii;
    const hh = RAIN_D * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    const hw = hh * camera.aspect;
    const cx = (2 * hw) / cols;
    const cy = (2 * hh) / rows;
    rain.material.size = 2 / ctx.renderer.getPixelRatio();
    const want = Math.min(Math.round(cols * 0.5), 160);
    while (drops.length < want) drops.push(newDrop(cols, rows, {}, true));
    drops.length = want;
    const tick = Math.floor(t * 9);
    let n = 0;
    for (const d of drops) {
      d.y += d.v * dt;
      if (d.y - d.len > rows || d.c >= cols) newDrop(cols, rows, d);
      const head = Math.floor(d.y);
      for (let k = 0; k < d.len && n < RAIN_MAX; k++) {
        const row = head - k;
        if (row < 0 || row >= rows) continue;
        // Glyphs flicker a few times a second, like code being rewritten.
        const h = Math.sin((d.c * 131 + row * 17 + tick * 7) * 12.9898) * 43758.5453;
        const jit = 0.6 + 0.4 * (h - Math.floor(h));
        const b = k === 0 ? 1 : 0.9 * Math.pow(1 - k / d.len, 1.3) * jit;
        rainPos[n * 3] = -hw + (d.c + 0.5) * cx;
        rainPos[n * 3 + 1] = hh - (row + 0.5) * cy;
        rainPos[n * 3 + 2] = 0;
        rainCol[n * 3] = k === 0 ? 0.85 : b * 0.25;
        rainCol[n * 3 + 1] = b;
        rainCol[n * 3 + 2] = k === 0 ? 0.85 : b * 0.4;
        n++;
      }
    }
    rainGeo.setDrawRange(0, n);
    rainGeo.attributes.position.needsUpdate = true;
    rainGeo.attributes.color.needsUpdate = true;
  }

  // DOM: copy, hint, z Z, popups and the render mode flash. All text.
  const style = document.createElement('style');
  style.textContent = `
    .layer-3 { cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
    .layer-3.drag { cursor: grabbing; }
    .layer-3.hover { cursor: pointer; }
    .layer-3 .s3-copy { position: absolute; left: 16px; right: 16px; bottom: 84px; text-align: center; pointer-events: none; }
    .layer-3 .s3-msg { min-height: 1.7em; font: 14px/1.7 var(--arcade); letter-spacing: .06em; color: var(--gold);
      text-shadow: 0 0 3px #000, 0 0 6px #000, 0 0 12px #ffc53d66; }
    .layer-3 .s3-cur { color: var(--hot); animation: s3-blink .7s steps(1) infinite; }
    .layer-3 .s3-hint { margin-top: 10px; font: 12px/1.8 var(--mono); color: var(--dim); text-shadow: 0 0 3px #000, 0 0 6px #000; opacity: 0; transition: opacity .6s; }
    .layer-3 .s3-hint.on { opacity: 1; }
    .layer-3 .s3-hint span { margin: 0 10px; white-space: nowrap; }
    .layer-3 .s3-hint b { color: var(--cyan); font-weight: normal; }
    .layer-3 .s3-hint .s3-r { pointer-events: auto; cursor: pointer; }
    .layer-3 .s3-flash { position: absolute; left: 16px; right: 16px; top: 16%; text-align: center; pointer-events: none;
      font: 16px/1 var(--arcade); color: var(--cyan); letter-spacing: .1em; text-shadow: 0 0 10px #4be3f088; opacity: 0; }
    .layer-3 .s3-flash.on { animation: s3-flash 1.4s ease-out forwards; }
    .layer-3 .s3-pop { position: absolute; transform: translate(-50%, -100%); pointer-events: none; white-space: nowrap;
      font: 18px/1 var(--arcade);
      text-shadow: 0 0 3px #000, 0 0 3px #000, 0 0 14px currentColor; animation: s3-pop 1.3s ease-out forwards; }
    .layer-3 .s3-zz { position: absolute; pointer-events: none; font: 12px/1 var(--arcade); color: var(--cyan);
      text-shadow: 0 0 8px #4be3f088; }
    .layer-3 .s3-zz span { position: absolute; opacity: 0; animation: s3-zz 3s linear infinite; }
    .layer-3 .s3-zz span:nth-child(2) { animation-delay: 1s; font-size: 15px; }
    .layer-3 .s3-zz span:nth-child(3) { animation-delay: 2s; font-size: 19px; }
    @keyframes s3-blink { 50% { opacity: 0; } }
    @keyframes s3-flash { 0% { opacity: 0; transform: scale(1.4); } 15% { opacity: 1; transform: scale(1); }
      70% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes s3-pop { 0% { opacity: 1; margin-top: 10px; scale: .6; } 12% { opacity: 1; margin-top: 0; scale: 1.15; }
      24% { scale: 1; }
      100% { opacity: 0; margin-top: -56px; } }
    @keyframes s3-zz { 0% { opacity: 0; transform: translate(0, 0); } 20% { opacity: 1; }
      100% { opacity: 0; transform: translate(30px, -60px); } }
    @media (max-width: 600px) {
      .layer-3 .s3-copy { bottom: 80px; }
      .layer-3 .s3-msg { font-size: 9px; }
      .layer-3 .s3-hint { font-size: 10px; margin-top: 6px; }
      .layer-3 .s3-hint span { margin: 0 6px; }
      .layer-3 .s3-flash { font-size: 11px; top: 12%; }
      .layer-3 .s3-pop { font-size: 13px; }
    }`;
  document.head.appendChild(style);

  const hint = touch
    ? '<span><b>[DRAG]</b> orbit</span><span><b>[PINCH]</b> zoom</span><span><b>[TAP]</b> a cat</span>'
    : '<span><b>[DRAG]</b> orbit</span><span><b>[SCROLL]</b> zoom</span><span><b>[CLICK]</b> a cat</span>';
  ctx.layer.innerHTML = `
    <div class="s3-zz"><span>z</span><span>z</span><span>Z</span></div>
    <div class="s3-flash"></div>
    <div class="s3-copy"><div class="s3-msg"></div>
      <div class="s3-hint">${hint}<span class="s3-r"><b>[R]</b> render mode</span></div></div>`;
  const $ = (s) => ctx.layer.querySelector(s);
  const msgEl = $('.s3-msg');
  const hintEl = $('.s3-hint');
  const zzEl = $('.s3-zz');
  const flashEl = $('.s3-flash');
  $('.s3-r').addEventListener('click', (e) => { e.stopPropagation(); setMode(state.mode + 1); });
  $('.s3-r').addEventListener('pointerdown', (e) => e.stopPropagation());

  // Orbit and clicks, on this stage's layer only.
  const HOME = { theta: 0, phi: 1.4, dist: 12.5 };
  const orbit = new Orbit({ ...HOME, target: new THREE.Vector3(0, -0.15, 0) });
  orbit.attach(ctx.layer);
  const ray = new THREE.Raycaster();
  const ndc = new THREE.Vector2();
  function catAt(e) {
    ndc.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    const hit = ray.intersectObject(kit.root, true)[0];
    return hit ? catNameOf(hit.object) : null;
  }
  ctx.layer.addEventListener('click', (e) => {
    if (orbit.moved > 6) return;
    const name = catAt(e);
    if (!name) return;
    kit.poke(name);
    ctx.sfx('meow');
    const [text, color] = POPS[name];
    const p = el('div', 's3-pop');
    p.textContent = text;
    p.style.color = color;
    p.style.left = `${e.clientX}px`;
    p.style.top = `${e.clientY - 8}px`;
    ctx.layer.appendChild(p);
    setTimeout(() => p.remove(), 1300);
  });
  ctx.layer.addEventListener('pointerdown', () => ctx.layer.classList.add('drag'));
  const undrag = () => ctx.layer.classList.remove('drag');
  ctx.layer.addEventListener('pointerup', undrag);
  ctx.layer.addEventListener('pointercancel', undrag);
  let hoverAt = 0;
  ctx.layer.addEventListener('pointermove', (e) => {
    if (orbit.dragging || e.pointerType !== 'mouse' || performance.now() - hoverAt < 60) return;
    hoverAt = performance.now();
    ctx.layer.classList.toggle('hover', !!catAt(e));
  });

  // Render modes.
  const state = { mode: 0, cell: 10, introT: 0, typed: -1, spin: 0, fps: 60, frames: 0, fpsT: 0, aspect: 0 };
  function cellFor() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    return w < 600 ? 8 : THREE.MathUtils.clamp(Math.round(h / 80), 9, 12);
  }
  function applyAscii() {
    ctx.setAscii({ cell: state.cell, mode: state.mode === 2 ? 2 : 0, fill: state.mode === 2 ? 0.12 : 0.4, edges: true,
      ridges: state.mode !== 2 }); // ridges would turn each code drop into a | line
  }
  function setMode(m, flash = true) {
    state.mode = ((m % MODES.length) + MODES.length) % MODES.length;
    kit.setWireframe(state.mode === 1);
    rain.visible = state.mode === 2;
    stars.visible = state.mode !== 2;
    applyAscii();
    if (!flash) return;
    flashEl.textContent = `RENDER · ${MODES[state.mode]}`;
    flashEl.classList.remove('on');
    void flashEl.offsetWidth;
    flashEl.classList.add('on');
    ctx.sfx('blip');
  }
  const onResize = () => {
    const c = cellFor();
    if (c !== state.cell) { state.cell = c; applyAscii(); }
  };

  let shadowWas = false;
  const ease = (x) => 1 - Math.pow(1 - x, 3);
  const proj = new THREE.Vector3();

  return {
    scene,
    camera,
    swipe: false, // drags orbit here
    enter() {
      // One scene pixel per star, whatever the device pixel ratio.
      stars.material.size = 2 / ctx.renderer.getPixelRatio();
      shadowWas = ctx.renderer.shadowMap.enabled;
      ctx.renderer.shadowMap.enabled = true;
      ctx.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      Object.assign(orbit, HOME);
      turntable.rotation.y = -0.9;
      state.cell = cellFor();
      state.typed = -1;
      state.introT = 0;
      msgEl.textContent = '';
      hintEl.classList.remove('on');
      flashEl.classList.remove('on');
      setMode(0, false);
      window.addEventListener('resize', onResize);
    },
    exit() {
      ctx.renderer.shadowMap.enabled = shadowWas;
      window.removeEventListener('resize', onResize);
      ctx.layer.classList.remove('drag', 'hover');
    },
    update(t, dt) {
      // Fit: on narrow screens widen the FOV so the whole stack stays in view.
      if (camera.aspect !== state.aspect) {
        state.aspect = camera.aspect;
        const tanV = Math.max(BASE_TAN, MIN_HALF_W / camera.aspect);
        camera.fov = THREE.MathUtils.radToDeg(2 * Math.atan(tanV));
        camera.updateProjectionMatrix();
      }

      // Intro: the camera swoops in from high and wide, then hands over to the orbit.
      if (orbit.dragging) state.introT = 1;
      state.introT = Math.min(1, state.introT + dt / 2.4);
      const k = 1 - ease(state.introT);
      const saved = { theta: orbit.theta, phi: orbit.phi, dist: orbit.dist };
      orbit.theta += k * 1.6;
      orbit.phi -= k * 0.75;
      orbit.dist *= 1 + k * 2.2;
      orbit.apply(camera);
      Object.assign(orbit, saved);

      // Turntable: slower while the faces point at the camera, quicker round the back.
      if (!orbit.dragging) {
        const facing = Math.cos(turntable.rotation.y + orbit.theta);
        turntable.rotation.y += dt * (0.12 + 0.42 * (1 - facing) * 0.5);
      }
      kit.update(t, dt);
      stars.rotation.y += dt * 0.006;
      if (rain.visible) rainStep(t, dt);

      // z Z over the grey cat's head.
      kit.zzAnchor.getWorldPosition(proj).project(camera);
      zzEl.style.display = proj.z < 1 ? '' : 'none';
      zzEl.style.transform = `translate(${(proj.x * 0.5 + 0.5) * window.innerWidth}px, ${(-proj.y * 0.5 + 0.5) * window.innerHeight}px)`;

      // Copy types itself in after the swoop starts, then the hint fades up.
      const typed = THREE.MathUtils.clamp(Math.floor((t - 0.7) * 38), 0, MSG.length);
      if (typed !== state.typed) {
        state.typed = typed;
        msgEl.innerHTML = `${MSG.slice(0, typed)}<span class="s3-cur">█</span>`;
        if (typed === MSG.length) hintEl.classList.add('on');
      }

      state.frames++;
      state.fpsT += dt;
      if (state.fpsT >= 0.5) {
        state.fps = Math.round(state.frames / state.fpsT);
        state.frames = 0;
        state.fpsT = 0;
      }
    },
    onKey(e) {
      if (e.key !== 'r' && e.key !== 'R') return false;
      setMode(state.mode + 1);
      return true;
    },
    hud: () => ({
      // The full title and the counter don't fit side by side on a phone.
      tl: window.innerWidth < 600 ? 'STAGE 03' : 'STAGE 03 · HOW CAN IT BE SUPER SICK?',
      tr: `${(ctx.ascii.cols * ctx.ascii.rows).toLocaleString('en-US')} CHARS × ${ctx.fps ? Math.round(ctx.fps()) : state.fps} FPS`,
    }),
  };
};

// Stage 4: how we use it in design, now with AI. A token race (HTML mockup against ASCII
// frame) runs on enter, then a 3D carousel of 4 ASCII cards that an "AI" types in line by
// line. E makes a quick live edit on the front card. Background: data streams in depth.
STAGES[4] = (ctx) => {
  // ---------- Card art ----------
  const IW = 36;   // inner width of a card, in characters
  const BODY = 13; // body lines per card

  // Place text at columns: L([12, '[ Open app ]'], [30, '▾']).
  const L = (...segs) => segs.reduce((s, [col, text]) => s.padEnd(col) + text, '');
  const frame = (title, body) => {
    const lines = [...body];
    while (lines.length < BODY) lines.push('');
    return [
      `┌─ ${title} ${'─'.repeat(IW - title.length - 1)}┐`,
      ...lines.map((l) => `│ ${l.padEnd(IW)} │`),
      `└${'─'.repeat(IW + 2)}┘`,
    ];
  };
  const row = (s) => `│ ${s.padEnd(32)} │`;
  const mail = (dot, name, subject, age) => row(`${dot} ${name.padEnd(12)}${subject.padEnd(13)}${age.padStart(4)}`);
  const rule = (l, r) => `${l}${'─'.repeat(34)}${r}`;
  const listTop = [
    `┌ Inbox ${'─'.repeat(16)} [ Write ] ┐`,
    row(`${'Search mail...'.padEnd(23)}Sort: New`),
    rule('├', '┤'),
  ];
  const listEnd = [rule('├', '┤'), row('[ Reply ]  [ Archive ]  [ Flag ]'), rule('└', '┘'), '', '● unread   ○ read'];
  const treeTop = [
    'Route a person who opens the app',
    '',
    L([12, '[ Open app ]']),
    L([17, '│']),
    L([12, '< Account? >']),
  ];
  const routeTop = [
    'Form submit, with an error path',
    '',
    '[ Submit ]──▸[ Validate ]',
    L([18, '│']),
    L([10, '┌───────┴───────┐']),
    L([8, 'valid'], [24, 'invalid']),
    L([10, '▾'], [26, '▾']),
    L([6, '[ Save ]'], [21, '[ ! Error ]']),
    L([10, '│'], [20, 'back to the form']),
    L([10, '▾']),
    L([6, '[ Notify ]──▸ Alert the team']),
  ];
  const flowTop = [
    'Invite a teammate in 3 steps',
    '',
    '[ 1·Open ] › [ 2·Pick ] › [ 3·Done ]',
    L([4, '│'], [17, '│'], [30, '│']),
    L([0, 'Team page'], [13, 'Email, role'], [26, 'Invited']),
    L([0, '4 people'], [13, 'sam@mail.co'], [26, 'Sam, as']),
    L([0, '[ Invite ]'], [13, '● Editor'], [26, 'Editor']),
    L([13, '○ Viewer'], [26, 'Email sent']),
  ];

  const CARDS = [
    {
      title: '1 · DECISION TREE',
      ask: 'add a branch for invites: join the team',
      a: [
        ...treeTop,
        L([8, '┌────────┴────────┐']),
        L([8, '▾ yes'], [26, '▾ no']),
        L([3, '[ Sign in ]'], [21, '[ Sign up ]']),
        L([8, '│'], [26, '│']),
        L([8, '▾'], [26, '▾']),
        L([6, 'Home'], [20, 'Verify email']),
        L([2, 'Welcome back'], [20, 'Then profile']),
      ],
      b: [
        ...treeTop,
        L([5, '┌───────────┼───────────┐']),
        L([5, '▾ yes'], [17, '▾ invite'], [29, '▾ no']),
        L([0, '[ Sign in ]'], [12, '[ Accept ]'], [24, '[ Sign up ]']),
        L([5, '│'], [17, '│'], [29, '│']),
        L([5, '▾'], [17, '▾'], [29, '▾']),
        L([3, 'Home'], [13, 'Join team'], [24, 'Verify email']),
        L([0, 'Welcome back'], [13, 'as member'], [24, 'Then profile']),
      ],
    },
    {
      title: '2 · DATA ROUTE',
      ask: 'then email the person a receipt',
      a: routeTop,
      b: [
        ...routeTop,
        L([10, '▾']),
        L([5, '[ Receipt ]──▸ Email the user']),
      ],
    },
    {
      title: '3 · UI WIREFRAME',
      ask: 'Priya replied. Move her to the top',
      a: [
        'Inbox, list view',
        ...listTop,
        mail('●', 'Ana Ruiz', 'Team lunch?', '2m'),
        mail('●', 'Dale Kim', 'Draft slides', '14m'),
        mail('○', 'Priya Nair', 'Trip photos', '1d'),
        mail('○', 'Tom Bell', 'Weekly notes', '3d'),
        ...listEnd,
      ],
      b: [
        'Inbox, list view',
        ...listTop,
        mail('●', 'Priya Nair', 'Re: Trip pics', 'now'),
        mail('●', 'Ana Ruiz', 'Team lunch?', '2m'),
        mail('●', 'Dale Kim', 'Draft slides', '14m'),
        mail('○', 'Tom Bell', 'Weekly notes', '3d'),
        ...listEnd,
      ],
    },
    {
      title: '4 · MICRO-FLOW',
      ask: 'add an undo toast after Done',
      a: [...flowTop, '', '', '', '3 taps, no page loads'],
      b: [
        ...flowTop,
        L([30, '│']),
        L([30, '▾']),
        L([6, 'Toast: Sam invited [ Undo ]']),
        '3 taps, with 5s to undo',
      ],
    },
  ];
  for (const c of CARDS) {
    c.a = frame(c.title, c.a);
    c.b = frame(c.title, c.b);
  }

  // ---------- Styles ----------
  const style = el('style');
  style.textContent = `
    .layer-4 .s4 { position: absolute; inset: 44px 0 76px; display: flex; flex-direction: column; align-items: center;
      justify-content: space-evenly; overflow: hidden; padding: 0 16px; user-select: none; -webkit-user-select: none; }
    .layer-4 button { all: unset; cursor: pointer; }
    .layer-4 button:focus-visible { outline: 1px dashed var(--cyan); outline-offset: 3px; }

    .layer-4 .s4-race { display: grid; grid-template-columns: auto auto auto auto; column-gap: 14px; row-gap: 6px;
      align-items: center; padding: 8px 14px; background: rgba(0, 0, 0, .72); }
    .layer-4 .s4-race .lbl { font: 10px/1 var(--arcade); letter-spacing: .06em; text-align: right; white-space: nowrap; }

    .layer-4 .s4-ring { display: grid; perspective: 1200px; touch-action: pan-y; cursor: grab; }
    .layer-4 .s4-card { grid-area: 1 / 1; margin: 0; padding: 6px 8px; background: rgba(3, 2, 10, .9);

      font: var(--cs)/1.15 var(--mono); width: calc(40ch + 16px); height: calc(var(--cs) * 1.15 * 15 + 12px); overflow: hidden; color: var(--ink);

    .layer-4 .s4-card .b { color: var(--cyan); opacity: .75; }
    .layer-4 .s4-card .a { color: var(--hot); }
    .layer-4 .s4-card .k { color: var(--gold); }
    .layer-4 .s4-card .h { color: var(--hot); text-shadow: 0 0 6px var(--hot); }
    .layer-4 .s4-card .t { color: var(--gold); }
    .layer-4 .s4-card .cur { color: var(--hot); }
    .layer-4 .s4-card.front { text-shadow: 0 0 6px rgba(75, 227, 240, .35); }
    .layer-4 .s4-card.front .b { opacity: 1; }

    .layer-4 .s4-ctrl { display: flex; align-items: center; gap: 18px; font: 11px/1 var(--arcade); color: var(--ink); }
    .layer-4 .s4-ctrl .turn { font: 22px/1 var(--mono); color: var(--cyan); padding: 4px 10px; text-shadow: 0 0 8px var(--cyan); }
    .layer-4 .s4-ctrl .turn:hover { color: var(--gold); text-shadow: 0 0 8px var(--gold); }
    .layer-4 .s4-ctrl .idx { min-width: 5em; text-align: center; }
    .layer-4 .s4-ctrl .edit { color: var(--gold); padding: 6px 4px; }
    .layer-4 .s4-ctrl .edit:hover { color: var(--hot); }
    .layer-4 .s4-ctrl .keys { color: var(--dim); font-size: 8px; }
    .layer-4 .s4-log { min-height: 1.4em; font: 12px/1.4 var(--mono); color: var(--dim); text-align: center; white-space: pre; }
    .layer-4 .s4-log .you { color: var(--cyan); }
    .layer-4 .s4-log .ai { color: var(--gold); }
    .layer-4 .s4-msg { text-align: center; }
    .layer-4 .s4-msg h2 { margin: 0 0 10px; font: clamp(10px, 1.5vw, 18px)/1.3 var(--arcade); color: var(--gold);
      text-shadow: 0 0 10px rgba(255, 197, 61, .55), 2px 2px 0 #7a2a00; letter-spacing: .04em; }
    .layer-4 .s4-msg p { margin: 0; font: clamp(8px, .9vw, 11px)/1.6 var(--arcade); color: var(--ink); }
    .layer-4 .s4-msg .w { opacity: 0; display: inline-block; transform: translateY(6px); transition: opacity .25s, transform .25s; }
    .layer-4 .s4-msg .w.on { opacity: 1; transform: none; }

    @keyframes s4-blink { 50% { opacity: 0; } }
    @keyframes s4-hl { 0%, 55% { color: var(--gold); text-shadow: 0 0 8px var(--gold); } 100% { } }

    @media (max-width: 640px) {
      .layer-4 .s4 { inset: 38px 0 84px; padding: 0 10px; }
      .layer-4 .s4-race { column-gap: 8px; padding: 6px 8px; }
      .layer-4 .s4-race .lbl { font-size: 7px; }
      .layer-4 .s4-race .bar, .layer-4 .rule.s4-vs { font-size: 12px; }
      .layer-4 .s4-race .num { font-size: 9px; min-width: 0; }
      .layer-4 .s4-race .tag { font-size: 7px; min-width: 0; }
      .layer-4 .s4-ctrl { gap: 10px; font-size: 9px; }
      .layer-4 .s4-ctrl .keys { display: none; }
      .layer-4 .s4-log { font-size: 10px; white-space: normal; }
    }
    @media (max-height: 760px) and (min-width: 641px) { .layer-4 .s4-msg h2 { margin-bottom: 6px; } }
  `;
  document.head.appendChild(style);

  // ---------- DOM ----------
  const words = (s) => s.split(' ').map((w) => `<span class="w">${w}</span>`).join(' ');
  ctx.layer.innerHTML = `
    <div class="s4">
      <div class="s4-race" data-no-scramble aria-label="Token race: an HTML mockup against an ASCII frame">
        <span class="lbl s4-vs">VS.</span><span class="rule s4-vs"></span><span class="go s4-vs"></span>
        <span class="lbl s4-html">HTML MOCKUP</span><span class="bar s4-html"></span><span class="num s4-html"></span><span class="tag s4-html"></span>
        <span class="lbl s4-ascii">ASCII FRAME</span><span class="bar s4-ascii"></span><span class="num s4-ascii"></span><span class="tag s4-ascii"></span>
        <span class="s4-est"><b>ESTIMATES</b> · PLACEHOLDER COUNTS UNTIL WE MEASURE A REAL SCREEN</span>
      </div>
      <div class="s4-ring" data-no-swipe data-no-scramble>${CARDS.map((c, i) => `<pre class="s4-card" data-i="${i}" aria-label="${c.title}"></pre>`).join('')}</div>
      <div class="s4-ctrl">
        <button class="turn prev" aria-label="Previous card">◂</button>
        <span class="idx">1 / 4</span>
        <button class="turn next" aria-label="Next card">▸</button>
        <button class="edit">[E] EDIT</button>
        <span class="keys">[A D] TURN</span>
      </div>
      <div class="s4-log" data-no-scramble aria-live="polite"></div>
      <div class="s4-msg">
        <h2>${words('VERY, VERY FAST AND TOKEN EFFICIENT.')}</h2>
        <p>${words('THE AI READS IT, WRITES IT AND CHANGES IT IN SECONDS.')}</p>
      </div>
    </div>`;
  const $ = (s) => ctx.layer.querySelector(s);
  const ui = {
    ring: $('.s4-ring'),
    cards: [...ctx.layer.querySelectorAll('.s4-card')],
    idx: $('.s4-ctrl .idx'),
    log: $('.s4-log'),
    msgWords: [...ctx.layer.querySelectorAll('.s4-msg .w')],
    rule: $('.s4-vs.rule'),
    go: $('.s4-vs.go'),
    html: { bar: $('.bar.s4-html'), num: $('.num.s4-html'), tag: $('.tag.s4-html') },
    ascii: { bar: $('.bar.s4-ascii'), num: $('.num.s4-ascii'), tag: $('.tag.s4-ascii') },
  };

  // ---------- Token race ----------
  const HTML_TOK = 20000;
  const ASCII_TOK = 1000;
  const RACE_AT = 0.7;   // seconds after enter
  const RACE_DUR = 3.6;
  const PARTS = ['', '▏', '▎', '▍', '▌', '▋', '▊', '▉'];
  const race = { tok: 0, saved: 0, barW: 40, last: '' };

  const fmt = (n) => n.toLocaleString('en-US');
  const ease = (u) => (u < 0.5 ? 2 * u * u : 1 - (-2 * u + 2) ** 2 / 2);
  function barText(v) {
    const eighths = Math.round((v / HTML_TOK) * race.barW * 8);
    const full = Math.floor(eighths / 8);
    const part = PARTS[eighths % 8];
    const track = race.barW - full - (part ? 1 : 0);
    return `<span class="fill">${'█'.repeat(full)}${part}</span><span class="track">${'░'.repeat(Math.max(0, track))}</span>`;
  }
  function drawRace(t) {
    const u = Math.min(1, Math.max(0, (t - RACE_AT) / RACE_DUR));
    race.tok = HTML_TOK * ease(u);
    const html = Math.round(race.tok);
    const asc = Math.min(ASCII_TOK, html);
    race.saved = Math.max(0, html - ASCII_TOK);
    const go = t < RACE_AT ? 'READY' : t < RACE_AT + 0.8 ? 'GO!' : '';
    const key = `${race.barW}|${Math.round(html / 25)}|${go}|${html >= HTML_TOK}|${u > 0}`;
    if (key === race.last) return;
    race.last = key;
    ui.go.textContent = go;
    const htmlDone = html >= HTML_TOK;
    const ascDone = asc >= ASCII_TOK;
    ui.html.bar.innerHTML = barText(html);
    ui.ascii.bar.innerHTML = barText(asc);
    ui.html.num.textContent = `~${fmt(htmlDone ? HTML_TOK : Math.round(html / 100) * 100)} TOK`;
    ui.ascii.num.textContent = `~${fmt(ascDone ? ASCII_TOK : Math.round(asc / 10) * 10)} TOK`;
    ui.html.tag.textContent = htmlDone ? 'DONE' : u > 0 ? 'WRITING' : '';
    ui.html.tag.className = `tag s4-html${htmlDone ? ' done' : ''}`;
    ui.ascii.tag.textContent = ascDone ? 'DONE!' : u > 0 ? 'WRITING' : '';
    ui.ascii.tag.className = `tag s4-ascii${ascDone ? ' win' : ''}`;
    if (ascDone && !race.cheered) { race.cheered = true; ctx.sfx('coin'); }
  }
  function sizeRace() {
    race.barW = window.innerWidth < 420 ? 12 : window.innerWidth < 640 ? 16 : window.innerWidth < 1000 ? 28 : 40;
    ui.rule.textContent = '─'.repeat(race.barW);
    race.last = '';
  }

  // ---------- Cards: typing, edits, carousel ----------
  const CURSOR = '█';
  const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  function paint(s, title) {
    let h = esc(s)
      .replace(/\[[^\]]*\]/g, '<span class="k">$&</span>')
      .replace(/[─│┌┐└┘├┤┬┴┼]+/g, '<span class="b">$&</span>')
      .replace(/[▾▸›]/g, '<span class="a">$&</span>')
      .replace(/●/g, '<span class="h">●</span>');
    if (title) h = h.replace(title, `<span class="t">${title}</span>`);
    return h;
  }

  let now = 0; // stage time, seconds
  const cards = CARDS.map((c, i) => ({
    ...c,
    i,
    el: ui.cards[i],
    lines: c.a,
    prev: c.a,
    edited: false,
    order: new Map(),  // line index -> typing order
    start: 0,
    lineT: 0.05,
    hl: false,
    hlUntil: 0,
    doneAt: 0,
    onDone: null,
    lastK: -1,
    html: '',
  }));

  function type(c, { prev, lines, at, lineT, hl }) {
    c.prev = prev;
    c.lines = lines;
    c.order = new Map();
    lines.forEach((l, i) => { if (l !== prev[i]) c.order.set(i, c.order.size); });
    c.start = at;
    c.lineT = lineT;
    c.hl = hl;
    c.doneAt = at + c.order.size * lineT;
    c.hlUntil = hl ? c.doneAt + 2 : 0;
    c.lastK = -1;
  }
  const blank = () => new Array(BODY + 2).fill('');
  const drawIn = (c, at) => type(c, { prev: blank(), lines: c.lines, at, lineT: 0.045, hl: false });

  function renderCard(c, isFront) {
    const out = [];
    let k = -1;
    for (let i = 0; i < c.lines.length; i++) {
      const o = c.order.get(i);
      let text;
      let typing = false;
      if (o === undefined) text = c.lines[i];
      else {
        const p = (now - c.start - o * c.lineT) / c.lineT;
        if (p <= 0) text = c.prev[i];
        else if (p < 1) { text = c.lines[i].slice(0, Math.ceil(c.lines[i].length * p)); typing = true; k = o; }
        else text = c.lines[i];
      }
      let h = paint(text, i === 0 ? c.title : '');
      if (typing) h += `<span class="cur">${CURSOR}</span>`;
      if (o !== undefined && c.hl && now < c.hlUntil) h = `<span class="hl">${h}</span>`;
      out.push(h);
    }
    if (isFront && k !== c.lastK && k >= 0) ctx.sfx('type');
    c.lastK = k;
    const html = out.join('\n');
    if (html !== c.html) { c.html = html; c.el.innerHTML = html; }
    if (c.onDone && now >= c.doneAt) { const f = c.onDone; c.onDone = null; f(); }
  }

  const ring = { rot: 0, target: 0, w: 0 };
  const front = () => ((Math.round(ring.target) % 4) + 4) % 4;

  function turn(d) {
    ring.target += d;
    const c = cards[front()];
    if (now >= c.doneAt) drawIn(c, now + 0.15);
    ui.idx.textContent = `${front() + 1} / 4`;
    ctx.sfx('blip');
  }

  function log(html) { ui.log.innerHTML = html; }
  function edit() {
    const c = cards[front()];
    if (now < c.doneAt) return;
    const next = c.edited ? c.a : c.b;
    const ask = c.edited ? 'undo that' : c.ask;
    const changed = next.filter((l, i) => l !== c.lines[i]).join('').replace(/ +/g, ' ').length;
    const tok = Math.max(20, Math.round(changed / 3 / 10) * 10);
    type(c, { prev: c.lines, lines: next, at: now + 0.45, lineT: 0.11, hl: true });
    c.edited = !c.edited;
    log(`<span class="you">YOU ›</span> "${esc(ask)}"`);
    c.onDone = () => log(`<span class="you">YOU ›</span> "${esc(ask)}"   <span class="ai">AI › DONE · ~${tok} TOKENS</span>`);
    ctx.sfx('select');
  }

  function placeCards(dt) {
    const k = 1 - Math.exp(-dt * 9);
    ring.rot += (ring.target - ring.rot) * k;
    if (Math.abs(ring.target - ring.rot) < 0.0005) ring.rot = ring.target;
    const w = ring.w || (ring.w = ui.ring.offsetWidth);
    const f = front();
    for (const c of cards) {
      const a = ((((c.i - ring.rot) % 4) + 6) % 4 - 2) * (Math.PI / 2); // wrapped to -180..180 deg
      const cos = Math.cos(a);
      const sin = Math.sin(a);
      const x = sin * w * 0.78;
      const z = (cos - 1) * w * 0.55;
      const ry = -a * (180 / Math.PI) * 0.47;
      const vis = (cos + 1) / 2;
      c.el.style.transform = Math.abs(a) < 1e-4 ? 'none' : `translate3d(${x.toFixed(1)}px,0,${z.toFixed(1)}px) rotateY(${ry.toFixed(2)}deg)`;
      c.el.style.opacity = (0.12 + 0.88 * vis ** 1.6).toFixed(3);
      c.el.style.zIndex = String(Math.round(vis * 100));
      c.el.classList.toggle('front', c.i === f);
    }
  }

  // Controls: buttons, click a side card to bring it round, swipe the ring.
  $('.s4-ctrl .prev').addEventListener('click', () => turn(-1));
  $('.s4-ctrl .next').addEventListener('click', () => turn(1));
  $('.s4-ctrl .edit').addEventListener('click', () => edit());
  let swipe = null;
  ui.ring.addEventListener('pointerdown', (e) => { swipe = { x: e.clientX, y: e.clientY }; });
  ui.ring.addEventListener('pointerup', (e) => {
    if (!swipe) return;
    const dx = e.clientX - swipe.x;
    const dy = e.clientY - swipe.y;
    swipe = null;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) { turn(dx < 0 ? 1 : -1); return; }
    const hit = e.target.closest?.('.s4-card');
    if (!hit) return;
    const d = ((+hit.dataset.i - front()) % 4 + 4) % 4;
    if (d === 1) turn(1);
    else if (d === 3) turn(-1);
    else if (d === 2) turn(2);
  });

  // ---------- Background: data streams flowing toward the camera ----------
  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x000000, 25, 190);
  const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 400);
  const stars = makeStars({ count: 600, colors: [PALETTE.ink, PALETTE.cyan, PALETTE.violet] });
  scene.add(stars);

  const LANES = 72;
  const PER = 14;
  const DEPTH = 210;
  const lanes = [];
  const sPos = new Float32Array(LANES * PER * 3);
  const sCol = new Float32Array(LANES * PER * 3);
  const tint = new THREE.Color();
  const laneColors = [PALETTE.cyan, PALETTE.cyan, PALETTE.hot, PALETTE.gold, PALETTE.violet];
  for (let l = 0; l < LANES; l++) {
    const ang = Math.random() * Math.PI * 2;
    const r = 10 + Math.random() * 38;
    const lane = { x: Math.cos(ang) * r, y: Math.sin(ang) * r * 0.62, z0: Math.random() * DEPTH, speed: 16 + Math.random() * 26, gap: 1.2 + Math.random() * 1.4 };
    lanes.push(lane);
    tint.set(laneColors[l % laneColors.length]);
    for (let k = 0; k < PER; k++) {
      const b = k === 0 ? 1 : 0.85 * (1 - k / PER);
      sCol.set([tint.r * b, tint.g * b, tint.b * b], (l * PER + k) * 3);
    }
  }
  const sGeo = new THREE.BufferGeometry();
  sGeo.setAttribute('position', new THREE.BufferAttribute(sPos, 3));
  sGeo.setAttribute('color', new THREE.BufferAttribute(sCol, 3));
  const streams = new THREE.Points(sGeo, new THREE.PointsMaterial({ size: 2, sizeAttenuation: false, vertexColors: true }));
  streams.frustumCulled = false;
  scene.add(streams);
  let travel = 0;

  function flow(dt, t) {
    // Streams rush while the race runs, then settle to a steady flow.
    const racing = t > RACE_AT && t < RACE_AT + RACE_DUR;
    const mul = racing ? 2.6 : 1;
    travel += dt * mul;
    for (let l = 0; l < LANES; l++) {
      const s = lanes[l];
      const head = ((s.z0 + s.speed * travel) % DEPTH) - DEPTH + 8;
      for (let k = 0; k < PER; k++) {
        const j = (l * PER + k) * 3;
        sPos[j] = s.x;
        sPos[j + 1] = s.y;
        sPos[j + 2] = head - k * s.gap * mul;
      }
    }
    sGeo.attributes.position.needsUpdate = true;
  }

  function sizePoints() {
    const s = 2 / ctx.renderer.getPixelRatio();
    streams.material.size = s;
    stars.material.size = s;
  }

  function onResize() {
    ring.w = 0;
    sizeRace();
    sizePoints();
  }
  window.addEventListener('resize', onResize);

  return {
    scene,
    camera,
    enter() {
      ctx.setAscii({ edges: false, fill: 0.18, ridges: true });
      now = 0;
      travel = 0;
      race.cheered = false;
      ring.rot = ring.target = 0;
      ui.idx.textContent = '1 / 4';
      log('');
      onResize();
      cards.forEach((c, i) => {
        c.edited = false;
        c.lines = c.a;
        c.onDone = null;
        c.html = '';
        drawIn(c, 0.3 + [0, 0.9, 1.5, 0.9][i]);
      });
      ui.msgWords.forEach((w) => w.classList.remove('on'));
    },
    update(t, dt) {
      now = t;
      drawRace(t);
      placeCards(dt);
      cards.forEach((c) => renderCard(c, c.i === front()));
      // The message lands word by word once the ASCII frame wins.
      const shown = Math.floor((t - RACE_AT - 0.9) / 0.12);
      ui.msgWords.forEach((w, i) => { if (i < shown && !w.classList.contains('on')) w.classList.add('on'); });
      flow(dt, t);
      camera.rotation.z = Math.sin(t * 0.25) * 0.08;
      stars.rotation.z = t * 0.01;
    },
    onKey(e) {
      const k = e.key.toLowerCase();
      if (k === 'a' || k === ',') turn(-1);
      else if (k === 'd' || k === '.') turn(1);
      else if (k === 'e') edit();
      else return false;
      return true;
    },
    hud: () => {
      const s = String(Math.round(race.saved)).padStart(6, '0');
      return { tl: 'STAGE 04 · HOW WE USE IT WITH AI', tr: `TOKENS SAVED ${s.slice(0, 3)},${s.slice(3)}` };
    },
  };
};

// A tiny zip writer: STORE method (no compression), CRC32, local headers, central directory and
// end record. No libraries. zipStore([[path, text], ...]) -> Uint8Array. Paths ending in / are
// folders. Stage 5 uses it to build the skill download from SKILL_FILES (embedded by build.py).
const ZIP_CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();

function zipCrc32(bytes) {
  let c = 0xffffffff;
  for (let i = 0; i < bytes.length; i++) c = ZIP_CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
  return (c ^ 0xffffffff) >>> 0;
}

// DOS time and date fields, local time.
function zipDosTime(d) {
  return {
    time: (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1),
    date: ((Math.max(d.getFullYear(), 1980) - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate(),
  };
}

function zipStore(entries, when = new Date()) {
  const enc = new TextEncoder();
  const { time, date } = zipDosTime(when);
  const locals = [];
  const centrals = [];
  let offset = 0;
  for (const [path, text] of entries) {
    const name = enc.encode(path);
    const isDir = path.endsWith('/');
    const data = isDir ? new Uint8Array(0) : enc.encode(text);
    const crc = zipCrc32(data);

    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true);   // local file header signature
    lh.setUint16(4, 20, true);           // version needed: 2.0
    lh.setUint16(6, 0x0800, true);       // flags: UTF-8 names
    lh.setUint16(8, 0, true);            // method: STORE
    lh.setUint16(10, time, true);
    lh.setUint16(12, date, true);
    lh.setUint32(14, crc, true);
    lh.setUint32(18, data.length, true); // compressed size
    lh.setUint32(22, data.length, true); // uncompressed size
    lh.setUint16(26, name.length, true);
    lh.setUint16(28, 0, true);           // extra length
    locals.push(new Uint8Array(lh.buffer), name, data);

    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true);   // central directory header signature
    ch.setUint16(4, 0x031e, true);       // made by: Unix, spec 3.0
    ch.setUint16(6, 20, true);
    ch.setUint16(8, 0x0800, true);
    ch.setUint16(10, 0, true);
    ch.setUint16(12, time, true);
    ch.setUint16(14, date, true);
    ch.setUint32(16, crc, true);
    ch.setUint32(20, data.length, true);
    ch.setUint32(24, data.length, true);
    ch.setUint16(28, name.length, true);
    ch.setUint16(30, 0, true);           // extra length
    ch.setUint16(32, 0, true);           // comment length
    ch.setUint16(34, 0, true);           // disk number
    ch.setUint16(36, 0, true);           // internal attributes
    ch.setUint32(38, isDir ? ((0o40755 << 16) | 0x10) >>> 0 : (0o100644 << 16) >>> 0, true);
    ch.setUint32(42, offset, true);      // local header offset
    centrals.push(new Uint8Array(ch.buffer), name);

    offset += 30 + name.length + data.length;
  }
  const cdSize = centrals.reduce((s, b) => s + b.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true);    // end of central directory signature
  end.setUint16(8, entries.length, true);  // entries on this disk
  end.setUint16(10, entries.length, true); // entries total
  end.setUint32(12, cdSize, true);
  end.setUint32(16, offset, true);       // central directory offset
  const parts = [...locals, ...centrals, new Uint8Array(end.buffer)];
  const out = new Uint8Array(offset + cdSize + 22);
  let at = 0;
  for (const p of parts) { out.set(p, at); at += p.length; }
  return out;
}

  renderer,
  ascii,
  setAscii,
  sfx: (name) => SFX.play(name),
  go: (n) => go(n),
  next: () => go(Math.min(targetStage() + 1, STAGE_COUNT)),
  back: () => go(Math.max(targetStage() - 1, 1)),
  score: game.score,
  fps: () => game.fps,
};

const stages = [];
for (let n = 1; n <= STAGE_COUNT; n++) {
  const layer = el('section', `layer layer-${n}`);
  layers.appendChild(layer);
  const stage = STAGES[n]({ ...ctxBase, layer });
  stage.layer = layer;
  stages[n] = stage;
}

// Stage shellDots in the bottom bar: one per stage, click to jump.
const shellDots = [];
for (let n = 1; n <= STAGE_COUNT; n++) {
  const b = el('button');
  b.type = 'button';
  b.textContent = '○';
  b.setAttribute('aria-label', `Stage ${n}`);
  b.addEventListener('click', (e) => { e.stopPropagation(); go(n); });
  hudDots.appendChild(b);
  shellDots[n] = b;
}
function drawDots(n) {
  for (let i = 1; i <= STAGE_COUNT; i++) {
    shellDots[i].textContent = i === n ? '●' : '○';
    shellDots[i].classList.toggle('on', i === n);
    if (i === n) shellDots[i].setAttribute('aria-current', 'step');
    else shellDots[i].removeAttribute('aria-current');
  }
}

// ---- Warp: streaking stars between stages, drawn through the ASCII pass as | / - \ ----
const shellWarp = (() => {
  const N = 420;
  const DEPTH = 260;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(70, 1, 0.1, 400);
  const pos = new Float32Array(N * 6);
  const col = new Float32Array(N * 6);
  const star = [];
  const palette = [PALETTE.ink, PALETTE.cyan, PALETTE.hot, PALETTE.gold, PALETTE.ink, PALETTE.violet];
  const c = new THREE.Color();
  for (let i = 0; i < N; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = 3 + Math.pow(Math.random(), 0.7) * 45;
    c.set(palette[i % palette.length]);
    star.push({ x: Math.cos(a) * r, y: Math.sin(a) * r, z: -Math.random() * DEPTH, r: c.r, g: c.g, b: c.b });
  }
  const geo = new THREE.BufferGeometry();
  const posAttr = new THREE.BufferAttribute(pos, 3).setUsage(THREE.DynamicDrawUsage);
  const colAttr = new THREE.BufferAttribute(col, 3).setUsage(THREE.DynamicDrawUsage);
  geo.setAttribute('position', posAttr);
  geo.setAttribute('color', colAttr);
  const lines = new THREE.LineSegments(geo, new THREE.LineBasicMaterial({ vertexColors: true, depthWrite: false }));
  lines.frustumCulled = false;
  scene.add(lines);

  function update(dt, speed) {
    const trail = Math.min(4 + speed * 0.11, 70);
    for (let i = 0; i < N; i++) {
      const s = star[i];
      s.z += speed * dt;
      if (s.z > -1) s.z -= DEPTH;
      const near = 1 - Math.min(-s.z / DEPTH, 1);
      const k = 0.35 + 0.65 * near;
      pos.set([s.x, s.y, s.z, s.x, s.y, s.z - trail], i * 6);
      col.set([s.r * k, s.g * k, s.b * k, 0, 0, 0], i * 6);
    }
    posAttr.needsUpdate = true;
    colAttr.needsUpdate = true;
    camera.rotation.z += dt * 0.6;
  }
  return { scene, camera, update };
})();

// ---- Transitions ----
// Phases of one transition, as a share of SHELL_TRANS_MS:
//   0 .. SHELL_SWAP     outgoing stage keeps running; its text, the HUD and the screen scramble out
//   SHELL_SWAP .. SHELL_ENTER  warp star field flies past
//   SHELL_ENTER .. 1    incoming stage is entered and running; its text and the screen resolve
const SHELL_TRANS_MS = 720;
const SHELL_SWAP = 0.24;
const SHELL_ENTER = 0.68;
let shellTrans = null;
let shellPending = 0;

function targetStage() { return shellTrans ? (shellPending || shellTrans.to) : game.current; }

// Scramble every text node under root. Remembers each node's real text; if the stage writes
// new text mid-transition, that becomes the real text.
const scrambleState = new WeakMap();
function scrambleLayer(root, amount, seed) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let i = 0;
  for (let node = walker.nextNode(); node; node = walker.nextNode()) {
    if (!node.nodeValue.trim() || node.parentElement?.closest('[data-no-scramble], style, script')) continue;
    let st = scrambleState.get(node);
    if (!st || node.nodeValue !== st.last) {
      st = { real: node.nodeValue, last: '' };
      scrambleState.set(node, st);
    }
    st.last = scrambleText(st.real, amount, seed + i++ * 0.37);
    if (node.nodeValue !== st.last) node.nodeValue = st.last;
  }
}
function restoreLayer(root) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  for (let node = walker.nextNode(); node; node = walker.nextNode()) {
    const st = scrambleState.get(node);
    if (st && node.nodeValue === st.last) node.nodeValue = st.real;
    scrambleState.delete(node);
  }
}

function shellActivate(n) {
  game.current = n;
  game.t = 0;
  const to = stages[n];
  setAscii();
  to.layer.classList.add('on');
  document.body.dataset.stage = n;
  to.enter?.();
  resize();
  if (location.hash !== `#${n}`) history.replaceState(null, '', `#${n}`);
}

function shellDeactivate(n) {
  const from = stages[n];
  from.exit?.();
  from.layer.classList.remove('on');
}

function go(n) {
  n = +n;
  if (!stages[n]) return;
  if (shellTrans) { shellPending = n === shellTrans.to ? 0 : n; return; }
  if (n === game.current) return;
  drawDots(n);
  MUSIC.stage(n);
  if (!game.current || SHELL_REDUCED_MOTION) {
    if (game.current) {
      SFX.play(n > game.current ? 'next' : 'back');
      shellDeactivate(game.current);
    }
    shellActivate(n);
    return;
  }
  SFX.play(n > game.current ? 'next' : 'back');
  setTimeout(() => SFX.play('warp'), 150);
  shellTrans = { from: game.current, to: n, start: performance.now(), swapped: false, entered: false, seed: Math.random() * 100,
    fromHud: hudFor(game.current) };
}

function stepTransition(now, dt) {
  const p = Math.min((now - shellTrans.start) / SHELL_TRANS_MS, 1);
  const from = stages[shellTrans.from];
  const to = stages[shellTrans.to];
  ascii.seed = Math.floor(now / 50) % 97;

  if (!shellTrans.swapped && p >= SHELL_SWAP) {
    restoreLayer(from.layer);
    shellDeactivate(shellTrans.from);
    shellTrans.swapped = true;
    setAscii({ edges: false, ridges: true, fill: 0.15 });
  }
  if (!shellTrans.entered && p >= SHELL_ENTER) {
    shellActivate(shellTrans.to);
    shellTrans.entered = true;
  }

  let hud;
  if (!shellTrans.swapped) {
    const q = p / SHELL_SWAP;
    from.update?.(game.t, dt);
    scrambleLayer(from.layer, q, shellTrans.seed);
    ascii.scramble = q * 0.8;
    hud = scrambleHud(shellTrans.fromHud, q);
    ascii.render(from.scene, from.camera);
  } else if (!shellTrans.entered) {
    const q = (p - SHELL_SWAP) / (SHELL_ENTER - SHELL_SWAP);
    shellWarp.update(dt, 30 + 520 * Math.sin(Math.PI * q) ** 2);
    ascii.scramble = Math.max(0, 0.8 - q * 3) * 0.8;
    hud = scrambleHud(q < 0.5 ? shellTrans.fromHud : hudFor(shellTrans.to, true), 1);
    ascii.render(shellWarp.scene, shellWarp.camera);
  } else {
    const q = (p - SHELL_ENTER) / (1 - SHELL_ENTER);
    to.update?.(game.t, dt);
    scrambleLayer(to.layer, 1 - q, shellTrans.seed + 7);
    ascii.scramble = (1 - q) * 0.6;
    hud = scrambleHud(hudFor(shellTrans.to), 1 - q);
    ascii.render(to.scene, to.camera);
  }
  writeHud(hud);

  if (p >= 1) {
    restoreLayer(to.layer);
    ascii.scramble = 0;
    shellTrans = null;
    const next = shellPending;
    shellPending = 0;
    if (next && next !== game.current) go(next);
  }
}

// ---- HUD ----
function defaultHud(n) {
  const s = String(n).padStart(2, '0');
  return { tl: `STAGE ${s}`, tr: '', bl: n > 1 ? '◂ BACK' : '', br: n < STAGE_COUNT ? 'NEXT ▸' : '' };
}
function hudFor(n, defaultsOnly = false) {
  const stage = stages[n];
  return { ...defaultHud(n), ...(!defaultsOnly && stage.hud?.() || {}) };
}
function scrambleHud(hud, amount) {
  const out = {};
  for (const k of Object.keys(hudEls)) out[k] = scrambleText(hud[k] || '', amount, k.charCodeAt(0) + k.charCodeAt(1));
  return out;
}
function writeHud(hud) {
  for (const k of Object.keys(hudEls)) if (hudEls[k].textContent !== hud[k]) hudEls[k].textContent = hud[k];
  const snd = `[M] SOUND + MUSIC ${SFX.on ? 'ON' : 'OFF'}`;
  if (hudSound.textContent !== snd) hudSound.textContent = snd;
}

hudEls.bl.addEventListener('click', (e) => { e.stopPropagation(); ctxBase.back(); });
hudEls.br.addEventListener('click', (e) => { e.stopPropagation(); ctxBase.next(); });
hudSound.addEventListener('click', (e) => { e.stopPropagation(); SFX.toggle(); });

// ---- Input ----
window.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  // Stages only see keys while they're settled; during a transition the shell queues moves.
  if (!shellTrans && stages[game.current].onKey?.(e)) { e.preventDefault(); return; }
  const k = e.key;
  if (k === 'ArrowRight' || k === ' ' || k === 'Enter' || k === 'PageDown') ctxBase.next();
  else if (k === 'ArrowLeft' || k === 'PageUp') ctxBase.back();
  else if (k === 'Escape') go(1);
  else if (k >= '1' && k <= String(STAGE_COUNT)) go(+k);
  else if (k === 'm' || k === 'M') SFX.toggle();
  else return;
  e.preventDefault();
});

// Swipe left for next, right for back. Stages that drag horizontally set swipe: false.
let shellTouch = null;
window.addEventListener('touchstart', (e) => {
  const t0 = e.touches[0];
  shellTouch = e.touches.length === 1 && !e.target.closest?.('[data-no-swipe]')
    ? { x: t0.clientX, y: t0.clientY, at: performance.now() } : null;
}, { passive: true });
window.addEventListener('touchend', (e) => {
  if (!shellTouch || stages[game.current]?.swipe === false) { shellTouch = null; return; }
  const t1 = e.changedTouches[0];
  const dx = t1.clientX - shellTouch.x;
  const dy = t1.clientY - shellTouch.y;
  const quick = performance.now() - shellTouch.at < 700;
  shellTouch = null;
  if (!quick || Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
  if (dx < 0) ctxBase.next();
  else ctxBase.back();
}, { passive: true });

function resize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  renderer.setSize(w, h, false);
  ascii.setSize(w, h);
  for (const cam of [...stages.map((s) => s?.camera), shellWarp.camera]) {
    if (!cam?.isPerspectiveCamera) continue;
    cam.aspect = w / h;
    cam.updateProjectionMatrix();
  }
}
window.addEventListener('resize', resize);
window.addEventListener('hashchange', () => go(+location.hash.slice(1) || 1));

go(+location.hash.slice(1) || 1);

let last = performance.now();
function frame(now) {
  const raw = (now - last) / 1000;
  const dt = Math.min(raw, 0.05);
  last = now;
  if (raw > 0) game.fps += (1 / raw - game.fps) * 0.05;
  game.t += dt;
  if (shellTrans) stepTransition(now, dt);
  else {
    const stage = stages[game.current];
    stage.update?.(game.t, dt);
    ascii.render(stage.scene, stage.camera);
    writeHud(hudFor(game.current));
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

</script>
</body>
</html>
