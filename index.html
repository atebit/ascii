<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What Is ASCII?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #f4ecdf; --dim: #8a8394; --hot: #ff3d8b; --cyan: #4be3f0; --gold: #ffc53d; --orange: #ff8a3d; --violet: #9b5cff;
    --arcade: "Press Start 2P", Menlo, monospace;
    --mono: Menlo, "SF Mono", Consolas, "DejaVu Sans Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--ink); overflow: hidden; font: 14px/1.4 var(--mono);
    -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
  #screen { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #layers { position: fixed; inset: 0; }
  .layer { position: absolute; inset: 0; display: none; }
  .layer.on { display: block; }

  /* HUD: white arcade text, framed by box-drawing rules like the storyboard. */
  .hud { position: fixed; z-index: 10; display: flex; align-items: center; gap: 12px;
    left: 0; right: 0; padding: 14px 16px; font: 12px/1 var(--arcade); letter-spacing: .08em; pointer-events: none;
    text-shadow: 0 0 6px rgba(244, 236, 223, .35); }
  .hud.top { top: 0; } .hud.bottom { bottom: 0; }
  .hud span, .hud button { white-space: nowrap; }
  /* Left text gives way first (ellipsis) so the right counter always stays on screen. */
  #hud-tl, #hud-bl { min-width: 0; flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; }
  #hud-tr, #hud-br, #hud-mid { flex: 0 0 auto; }
  .hud .rule { flex: 1 1 0; min-width: 8px; overflow: hidden; font: 14px/1 var(--mono); color: var(--violet); opacity: .45; text-shadow: none; }
  #hud-tl, #hud-bl { color: var(--ink); }
  #hud-tr { color: var(--gold); text-shadow: 0 0 8px rgba(255, 197, 61, .45); }
  #hud-br { color: var(--orange); text-shadow: 0 0 8px rgba(255, 138, 61, .45); }
  #hud-bl, #hud-br, #hud-sound { pointer-events: auto; cursor: pointer; }
  #hud-mid { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  #hud-hearts { color: var(--hot); letter-spacing: .3em; margin-right: -.3em; text-shadow: 0 0 8px #ff3d8b99; }
  #hud-hearts span { display: inline-block; animation: hud-beat 1.6s ease-in-out infinite; }
  #hud-hearts span:nth-child(2) { animation-delay: .12s; } #hud-hearts span:nth-child(3) { animation-delay: .24s; }
  #hud-hearts span:nth-child(4) { animation-delay: .36s; } #hud-hearts span:nth-child(5) { animation-delay: .48s; }
  @keyframes hud-beat { 0%, 70%, 100% { transform: scale(1); } 80% { transform: scale(1.25); } }
  #hud-dots { display: flex; gap: 2px; pointer-events: auto; }
  #hud-dots button { all: unset; cursor: pointer; font: 12px/1 var(--mono); color: var(--dim); padding: 2px 4px; }
  #hud-dots button:hover, #hud-dots button:focus-visible { color: var(--ink); }
  #hud-dots button.on { color: var(--cyan); text-shadow: 0 0 6px var(--cyan); }
  #hud-sound { position: fixed; z-index: 10; right: 16px; bottom: 52px; font: 8px/1 var(--arcade); color: var(--dim); }

  /* CRT: scanlines, vignette and a faint flicker over everything. Never takes pointer events. */
  #crt { position: fixed; inset: 0; z-index: 50; pointer-events: none;
    background:
      radial-gradient(ellipse 85% 80% at 50% 50%, transparent 60%, rgba(0, 0, 0, .6) 100%),
      repeating-linear-gradient(to bottom, transparent 0 2px, rgba(0, 0, 0, .22) 2px 3px); }
  #crt::after { content: ""; position: absolute; inset: 0;
    background: radial-gradient(ellipse 70% 60% at 50% 55%, rgba(255, 61, 139, .05), transparent 70%);
    animation: crt-flicker 5s steps(1) infinite; }
  @keyframes crt-flicker { 0%, 100% { opacity: 1; } 31% { opacity: .7; } 32% { opacity: 1; } 77% { opacity: .82; } 78% { opacity: 1; } }

  @media (max-width: 600px) {
    .hud { font-size: 8px; gap: 6px; padding: 12px 10px; }
    .hud .rule { font-size: 10px; }
    #hud-hearts { letter-spacing: .1em; margin-right: -.1em; }
    #hud-dots button { padding: 4px 5px; font-size: 13px; }
    #hud-sound { bottom: 58px; right: 10px; }
  }
  @media (prefers-reduced-motion: reduce) { #hud-hearts span, #crt::after { animation: none; } }
</style>
</head>

"design-wireframe-ascii/README.md": "# design-wireframe-ascii\n\nA skill for coding agents that sketches screens and flows as ASCII wireframes. It goes wide with different concepts, combines the best, stress-tests them with scenarios, and maps interactions step by step. Text only, so it's fast and cheap on tokens.\n\n## Files\n\n- `SKILL.md`: the method. The agent reads it when your ask matches its description.\n- `reference.md`: the templates for each mode.\n- `README.md`: this file.\n\n## Install\n\nUnzip so the folder sits at `<skills folder>/design-wireframe-ascii/SKILL.md`.\n\n**Claude Code**, for one project (commit it to share with your team):\n\n```sh\nmkdir -p .claude/skills\nunzip design-wireframe-ascii.zip -d .claude/skills/\n```\n\n**Claude Code**, for every project on your machine:\n\n```sh\nmkdir -p ~/.claude/skills\nunzip design-wireframe-ascii.zip -d ~/.claude/skills/\n```\n\n**Cursor**, for one project:\n\n```sh\nmkdir -p .cursor/skills\nunzip design-wireframe-ascii.zip -d .cursor/skills/\n```\n\nStart a new agent session so it picks up the skill.\n\n## Use\n\nPaste a prompt and fill in the `{ }`:\n\n1. Sketch one screen: \"I'm working on {project} and I'd like to explore {a screen} with the ascii wireframe skill.\"\n2. Go wide: \"I'm working on {project} and I'd like to go wide on {a screen or flow} with the ascii wireframe skill, 10 different concepts.\"\n3. Map a flow: \"I'm working on {project} and I'd like to map the step-by-step flow for {an interaction} with the ascii wireframe skill.\"\n\nFor example: \"I'm working on a recipe app and I'd like to explore the settings page with the ascii wireframe skill.\"\n\nThe agent saves each step as markdown in a `wireframes/` folder. Say where if you want it somewhere else. Then ask it to combine concepts, stress-test the design, or detail an interaction.\n",
"design-wireframe-ascii/SKILL.md": "---\nname: design-wireframe-ascii\ndescription: Generate ASCII wireframes and run a diverge → converge design cycle for a UI or interaction idea. Go wide with genuinely different concepts, converge the best into 1–2 designs, stress-test them with scenarios, and detail interactions as `[ ] › [ ] › [ ]` micro-flows. Saves each stage as a markdown file in a wireframes/ folder. Use to sketch, wireframe or prototype a UI, panel, screen or flow in ASCII, \"go wide\", combine concepts, stress-test a design, or map a micro-interaction. Text only.\n---\n\n# design-wireframe-ascii\n\n**Not for:** real UI code or images (no React, HTML or generated images; a running prototype is a different job) · Figma (use the Figma tools) · product definition (fold outputs into a PRD or spec, don't replace it) · a product scope, coherence or impact question.\n\n## Modes\n\nA cycle, not a line: stress-test gaps feed a re-diverge or a refined v2. Run only the mode the ask needs:\n\n- \"sketch / wireframe / go wide / more concepts\" → **Diverge**\n- \"combine / refine / which is best / lock a direction\" → **Converge**\n- \"what does it look like when… / scenarios / at scale\" → **Stress-test**\n- \"show the micro-interaction / step flow / `[]›[]›[]`\" → **Detail**\n\n## Rules (every mode)\n\n1. **Declare the frame first:** the surface (sidebar, modal, full screen…), the real-estate constraint (\"thin vertical ~34 cols\"), and the primary user. Every mock fits it. A mock that overflows lies about the design; change the constraint explicitly instead.\n2. **Legend once:** define a small glyph vocabulary (e.g. `● done ◐ current ○ todo · ⚠ attention · → action`) and reuse it verbatim. Never use a glyph you didn't legend.\n3. **Ground, don't invent:** when sketching a real system, read its files (front matter, folders, statuses) so labels and states are truthful. Never fabricate gate criteria, statuses or side effects. Mark anything speculative, and keep example data consistent across a doc.\n4. **Name the tension:** every catalog, design and scenario names its load-bearing assumption, what you invented, and its trade-offs and gaps.\n5. **Prose:** plain, specific, short. This governs prose only. ASCII mocks, the glyph legend and `[ ] › [ ] › [ ]` notation stay verbatim.\n6. One topic per run. Modes can run in sequence across turns.\n\n## Output\n\nSave to a `wireframes/` folder at the project root, or wherever the user says:\n\n```text\nwireframes/<topic>-concepts.md                     # Diverge catalog\nwireframes/<topic>-refined-design.md               # Converge candidate(s)\nwireframes/<topic>-scenarios.md                    # Stress-test user stories\nwireframes/<topic>-<interaction>-microflow.md      # Detail flow\n```\n\nEach file opens with a leading ```` ```yaml ```` fence: `title`, `date`, `author`, `status: prototype (<mode>)`, `topic`. Read the project's related design docs (start from user flows when they exist), research and spec as needed. Read `reference.md` for the per-mode templates before drafting.\n\n## Diverge\n\n- N concepts (default 5; \"go wide\" → 10+), each a different **organizing principle** (by stage, object, time, action, relationship), not a restyled copy. Two concepts that differ only cosmetically are one concept.\n- Open with a **divergence map**. Each concept carries a name and one-line concept, the one data point it privileges, an ASCII mock, and a one-line strength and weakness.\n- Close with a **cross-concept comparison** (rate each on the jobs that matter, e.g. overview / detail / scales-in-space / familiarity) and the **organizing axes** the set collapses to. Tee up convergence; never pick a winner silently.\n\n## Converge\n\n1. Ask the user for the anchors (which concepts or axes to fuse), offering a recommended default. Convergence is the user's call.\n2. Draft the combined design as **zones** (persistent, toggled, on-demand), showing the default state and any expanded or alternate states.\n3. Record this iteration's **locked decisions** at the top.\n4. Define the **signal system:** which data points sit on the always-visible surface vs revealed on expand, at ~2–3 signals per line before it's noise.\n5. List the **open questions** the mock can't resolve. They seed the next loop.\n\n## Stress-test\n\nWrite ~8–12 user stories covering the stress axes in `reference.md`, render each in the design, and name the gap it exposes. Always end with a **Synthesis** table (`Gap | Triggered by | Fix`). The gaps are the deliverable. Offer to fold them into the refined design as **v2**.\n\n## Detail\n\n1. **Glance flow** first: the whole sequence on one line, with branches.\n2. **One panel state per step,** each noting what fires under the hood when it maps to a real command, API call or operation, grounded in the real contract.\n3. The **state transition** the object undergoes and, where useful, a before/after of how it reads back in the parent surface.\n4. Close with **design notes and open questions** (undo? failure paths? where is it triggered?).\n\nEnd every run by offering the next arc of the cycle.\n",
"design-wireframe-ascii/reference.md": "# design-wireframe-ascii: reference\n\nPer-mode templates. Outer templates use four backticks so the inner ```` ```text ```` mock fence survives.\n\n## Diverge\n\nDivergence map, at the top of the catalog:\n\n```text\n| # | Concept | Organizing principle | Unit | Privileges |\n|---|---------|----------------------|------|------------|\n```\n\nConcept:\n\n````text\n## Concept N: <name> (<principle>)\n\n<one-line concept>\n\n```text\n<ASCII mock at declared width>\n```\n\n- **Privileges:** <the one thing it makes obvious>\n- **Strength:** <…>  **Weakness:** <…>\n````\n\n## Stress-test\n\nStress axes to cover: light/baseline · high volume/scale · multi-role/team · firefight (many blocked) · empty/\"all quiet\" · batch (many same-state) · the edge signal the design under-serves · cross-boundary/hand-off · staleness/time · personal-scope filter in a big org.\n\nScenario:\n\n````text\n## S<n>: <name>\n\n**Context:** <who, how many items, what states>\n\n```text\n<ASCII mock of the design under this condition>\n```\n\n**Exposes:** <the concrete design gap this scenario reveals>\n````\n\n## Detail\n\nGlance flow:\n\n```text\n[ 1·Trigger ] › [ 2·Check ] › [ 3·Confirm ] › [ 4·Execute ] › [ 5·Done ]\n                     └─(fail)→ [ 2b·Fix ] ⟲ back\n```\n"

// ASCII pass: render the scene at one or two pixels per cell, then draw one glyph per cell
// from a font atlas. Brightness picks a glyph from the ramp; depth edges pick | / - \.
// Options (all settable after construction):
//   edges   depth breaks (silhouettes) draw as | / - \
//   ridges  thin bright lines (line art, grids, streaks) draw as | / - \ along the line
//   scramble 0..1: share of cells swapped for random glyphs (the shell's stage transition)
const ASCII_RAMP = ' .:-~=+*oxX#%@';
const ASCII_EDGES = '|/-\\';
const ASCII_FONT = 'Menlo, "SF Mono", Consolas, "DejaVu Sans Mono", monospace';

function makeGlyphAtlas(chars, w, h) {
  const canvas = document.createElement('canvas');
  canvas.width = w * chars.length;
  canvas.height = h;
  const g = canvas.getContext('2d');
  g.fillStyle = '#000';
  g.fillRect(0, 0, canvas.width, canvas.height);
  g.fillStyle = '#fff';
  g.font = `bold ${Math.round(h * 0.8)}px ${ASCII_FONT}`;
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  [...chars].forEach((ch, i) => g.fillText(ch, i * w + w / 2, h * 0.54));
  const tex = new THREE.CanvasTexture(canvas);
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;
  tex.generateMipmaps = false;
  return tex;
}

const ASCII_VERT = /* glsl */ `
varying vec2 vUv;
void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }

vec3 sceneAt(vec2 uv) { return toSRGB(texture2D(tScene, uv).rgb); }
float lumOf(vec3 c) { return dot(c, vec3(0.299, 0.587, 0.114)); }
float lumAt(vec2 uv) { return lumOf(sceneAt(uv)); }
float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
float lineGlyph(float deg) {
  float e = mod(deg, 180.0);
  return (e < 22.5 || e >= 157.5) ? 2.0 : (e < 67.5 ? 1.0 : (e < 112.5 ? 0.0 : 3.0));
}
float depthAt(vec2 uv) {
  float z = texture2D(tDepth, uv).r * 2.0 - 1.0;
  return (2.0 * near * far) / (far + near - z * (far - near));

  float idx = floor(clamp(pow(l, 1.25) * 1.15, 0.0, 0.999) * rampLen);
  vec3 tint = c;
  bool edged = false;

    float d02 = depthAt(uv + px * vec2(-1.0, -1.0));
    float d12 = depthAt(uv + px * vec2( 0.0, -1.0));
    float d22 = depthAt(uv + px * vec2( 1.0, -1.0));
    float dc  = depthAt(uv);
    float gx = (d20 + 2.0 * d21 + d22) - (d00 + 2.0 * d01 + d02);
    float gy = (d00 + 2.0 * d10 + d20) - (d02 + 2.0 * d12 + d22);
    float dmin = min(min(min(d00, d10), min(d20, d01)), min(min(d21, d02), min(min(d12, d22), dc)));
    float dmax = max(max(max(d00, d10), max(d20, d01)), max(max(d21, d02), max(max(d12, d22), dc)));
    // Only real breaks in depth (silhouettes, overlaps), not the curve of a surface.
    if ((dmax - dmin) / max(dmin, 0.001) > 0.12 && dmin < far * 0.9) {
      // Edge runs at right angles to the depth gradient, measured in screen space.
      idx = rampLen + lineGlyph(degrees(atan(gy / cellPx.y, gx / cellPx.x)) + 90.0);
      edged = true;
      tint = max(c, max(max(sceneAt(uv + px * vec2(-1.0, 0.0)), sceneAt(uv + px * vec2(1.0, 0.0))),
                        max(sceneAt(uv + px * vec2(0.0, 1.0)), sceneAt(uv + px * vec2(0.0, -1.0)))));
    }
  }

  if (ridges && !edged && l > 0.06) {
    // A thin bright line has bright neighbors on both sides along it and dark ones across it.
    // Score the 4 line directions by the dimmer of the two neighbors along each one.
    // Single specks (no support) and filled areas (support everywhere) keep their ramp glyph.
    float l00 = lumAt(uv + px * vec2(-1.0,  1.0));
    float l10 = lumAt(uv + px * vec2( 0.0,  1.0));
    float l20 = lumAt(uv + px * vec2( 1.0,  1.0));
    float l01 = lumAt(uv + px * vec2(-1.0,  0.0));
    float l21 = lumAt(uv + px * vec2( 1.0,  0.0));
    float l02 = lumAt(uv + px * vec2(-1.0, -1.0));
    float l12 = lumAt(uv + px * vec2( 0.0, -1.0));
    float l22 = lumAt(uv + px * vec2( 1.0, -1.0));
    vec4 along = vec4(min(l10, l12), min(l20, l02), min(l01, l21), min(l00, l22)); // glyphs | / - and back-slash
    vec4 across = along.zwxy;
    vec4 score = along - 1.6 * across - 0.03;
    float best = max(max(score.x, score.y), max(score.z, score.w));
    if (best > 0.3 * l) {
      idx = rampLen + (score.x == best ? 0.0 : score.y == best ? 1.0 : score.z == best ? 2.0 : 3.0);
    }
  }

  if (scramble > 0.0) {
    float h = hash(cell + seed);
    if (h < scramble) {
      float h2 = hash(cell * 1.7 + seed + 3.1);
      idx = 1.0 + floor(h2 * (nGlyph - 1.0));
      if (lumOf(tint) < 0.08 && h < scramble * 0.45) {
        float h3 = hash(cell * 0.7 + seed + 9.4);
        tint = h3 < 0.3 ? vec3(1.0, 0.24, 0.55) : h3 < 0.55 ? vec3(0.29, 0.89, 0.94)
             : h3 < 0.75 ? vec3(1.0, 0.77, 0.24) : vec3(0.6, 0.36, 1.0);
        tint *= 0.35 + 0.45 * h2;
      }
    }
  }

  float m = texture2D(tAtlas, vec2((idx + f.x) / nGlyph, f.y)).r;
  float lt = sqrt(max(lumOf(tint), 0.0));
  vec3 col;
  if (mode == 0) {
    // Brighten without clipping: scale back down by the top channel so pink stays pink.
    col = max(mix(vec3(lumOf(tint)), tint, 1.5) * 1.65, 0.0);
    col /= max(1.0, max(col.r, max(col.g, col.b)));
  }
  else if (mode == 1) col = vec3(1.0, 0.93, 0.82) * (0.35 + 0.75 * lt);
  else col = vec3(0.25, 1.0, 0.45) * (0.3 + 0.85 * lt);

  // Each cell gets a dim fill of its own color (like an ANSI background color), so dark
  // features such as eyes read as holes in the fur.
  vec3 outc = bg + mix(c * fill, col, m) + c * glow;
  outc *= 0.9 + 0.1 * sin(gl_FragCoord.y * 3.14159 / max(cellPx.y * 0.25, 1.0));
  gl_FragColor = vec4(outc, 1.0);
}
`;

class AsciiPass {
  constructor(renderer, { cell = 12, mode = 0, edges = true, ridges = false, glow = 0.1, fill = 0.4, scale = 2 } = {}) {
    this.renderer = renderer;
    this.cell = cell;      // cell height in CSS px
    this.aspect = 0.6;     // glyph width / height
    this.scale = scale;    // scene pixels per cell, per axis
    this.chars = ASCII_RAMP + ASCII_EDGES;
    this.target = new THREE.WebGLRenderTarget(1, 1, { depthBuffer: true });
    this.target.depthTexture = new THREE.DepthTexture(1, 1);
    this.material = new THREE.ShaderMaterial({
      vertexShader: ASCII_VERT,
      fragmentShader: ASCII_FRAG,
      depthTest: false,
      depthWrite: false,
      uniforms: {
        tScene: { value: this.target.texture },
        tDepth: { value: this.target.depthTexture },
        tAtlas: { value: null },
        grid: { value: new THREE.Vector2(1, 1) },
        cellPx: { value: new THREE.Vector2(1, 1) },
        offsetPx: { value: new THREE.Vector2(0, 0) },
        nGlyph: { value: this.chars.length },
        rampLen: { value: ASCII_RAMP.length },
        mode: { value: mode },
        edges: { value: edges },
        ridges: { value: ridges },
        scramble: { value: 0 },
        seed: { value: 0 },
        near: { value: 0.1 },
        far: { value: 100 },
        glow: { value: glow },
        fill: { value: fill },
        bg: { value: new THREE.Color(0x000000) },
      },
    });
    this.quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.material);
    this.quad.frustumCulled = false;
    this.quadScene = new THREE.Scene();
    this.quadScene.add(this.quad);
    this.quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    this.cols = 1;
    this.rows = 1;
  }

  get mode() { return this.material.uniforms.mode.value; }
  set mode(v) { this.material.uniforms.mode.value = v; }
  get fill() { return this.material.uniforms.fill.value; }
  set fill(v) { this.material.uniforms.fill.value = v; }
  get edges() { return this.material.uniforms.edges.value; }
  set edges(v) { this.material.uniforms.edges.value = v; }
  get ridges() { return this.material.uniforms.ridges.value; }
  set ridges(v) { this.material.uniforms.ridges.value = v; }
  get scramble() { return this.material.uniforms.scramble.value; }
  set scramble(v) { this.material.uniforms.scramble.value = v; }
  get seed() { return this.material.uniforms.seed.value; }
  set seed(v) { this.material.uniforms.seed.value = v; }

  setSize(w, h) {
    const dpr = this.renderer.getPixelRatio();
    const ch = this.cell;
    const cw = ch * this.aspect;
    this.cols = Math.max(1, Math.floor(w / cw));
    this.rows = Math.max(1, Math.floor(h / ch));
    this.target.setSize(this.cols * this.scale, this.rows * this.scale);
    const u = this.material.uniforms;
    u.grid.value.set(this.cols, this.rows);
    u.cellPx.value.set(cw * dpr, ch * dpr);
    u.offsetPx.value.set(((w - this.cols * cw) / 2) * dpr, ((h - this.rows * ch) / 2) * dpr);
    if (u.tAtlas.value) u.tAtlas.value.dispose();
    u.tAtlas.value = makeGlyphAtlas(this.chars, Math.ceil(cw * dpr * 2), Math.ceil(ch * dpr * 2));
  }

  render(scene, camera) {
    const r = this.renderer;
    const u = this.material.uniforms;
    u.near.value = camera.near;
    u.far.value = camera.far;
    r.setRenderTarget(this.target);
    r.render(scene, camera);
    r.setRenderTarget(null);
    r.render(this.quadScene, this.quadCam);
  }
}

// Drag to orbit, scroll or pinch to zoom. One state can drive several cameras.
class Orbit {
  constructor({ theta = 0, phi = 1.35, dist = 9, target = new THREE.Vector3() } = {}) {
    this.theta = theta;
    this.phi = phi;
    this.dist = dist;
    this.target = target;
    this.dragging = false;
    this.moved = 0;
  }

  attach(el) {
    let last = null;
    const pointers = new Map();
    let pinch = 0;
    el.addEventListener('pointerdown', (e) => {
      pointers.set(e.pointerId, e);
      last = e;
      this.dragging = true;
      this.moved = 0;
      el.setPointerCapture(e.pointerId);
    });
    el.addEventListener('pointermove', (e) => {
      if (!pointers.has(e.pointerId)) return;
      pointers.set(e.pointerId, e);
      if (pointers.size === 2) {
        const [a, b] = [...pointers.values()];
        const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
        if (pinch) this.zoom(pinch / d);
        pinch = d;
        return;
      }
      const dx = e.clientX - last.clientX;
      const dy = e.clientY - last.clientY;
      this.moved += Math.abs(dx) + Math.abs(dy);
      this.theta -= dx * 0.008;
      this.phi = THREE.MathUtils.clamp(this.phi - dy * 0.008, 0.35, 2.4);
      last = e;
    });
    const end = (e) => {
      pointers.delete(e.pointerId);
      pinch = 0;
      if (!pointers.size) this.dragging = false;
    };
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
    el.addEventListener('wheel', (e) => {
      e.preventDefault();
      this.zoom(Math.exp(e.deltaY * 0.001));
    }, { passive: false });
  }

  zoom(f) { this.dist = THREE.MathUtils.clamp(this.dist * f, 4, 20); }

  apply(camera) {
    const s = Math.sin(this.phi);
    camera.position.set(
      this.target.x + this.dist * s * Math.sin(this.theta),
      this.target.y + this.dist * Math.cos(this.phi),
      this.target.z + this.dist * s * Math.cos(this.theta),
    );
    camera.lookAt(this.target);
  }
}

// The 3 stacked clay cats from the reference: grey asleep at the bottom, orange lying on
// top of it, pink sitting at the back and waving. Built from spheres, capsules, cones and
// tubes. Units: about 1 = the grey cat's head radius; the ground is y = 0 before centring.
const CAT = {
  grey: 0x8e919c,
  orange: 0xf5b04c,
  pink: 0xf8c6d2,
  inner: 0xee8aa2,
  eye: 0x18161c,
  white: 0xffffff,
};

function clay(color) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.62, metalness: 0 });
}

function solid(geo, mat) {
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

// Place a feature on the front of a sphere of radius r and turn it to face outward.
// Call before adding obj to a parent: lookAt reads world space.
function onFace(obj, r, x, y, out = 0) {
  const z = Math.sqrt(Math.max(r * r - x * x - y * y, 0));
  const p = new THREE.Vector3(x, y, z);
  obj.lookAt(p.clone().multiplyScalar(2));
  obj.position.copy(p.addScaledVector(p.clone().normalize(), out));
  return obj;
}

// eyes: 'open' (orange), 'closed' ‿ (grey, asleep) or 'happy' ∩ (pink).
function makeHead(r, color, eyes, { peek = false } = {}) {
  const head = new THREE.Group();
  const skin = clay(color);
  const inner = clay(CAT.inner);
  const dark = clay(CAT.eye);
  const white = clay(CAT.white);

  const skull = solid(new THREE.SphereGeometry(r, 48, 32), skin);
  skull.scale.set(1.08, 0.93, 1);
  head.add(skull);

  for (const s of [-1, 1]) {
    const ear = new THREE.Group();
    const outer = solid(new THREE.ConeGeometry(r * 0.36, r * 0.62, 24), skin);
    outer.scale.z = 0.6;
    const pad = solid(new THREE.ConeGeometry(r * 0.24, r * 0.42, 24), inner);
    pad.scale.z = 0.4;
    pad.position.set(0, -r * 0.05, r * 0.15);
    ear.add(outer, pad);
    ear.position.set(s * r * 0.58, r * 0.72, -r * 0.05);
    ear.rotation.z = -s * 0.42;
    head.add(ear);
  }

  const rig = { blinkers: [], pupils: [], peekOpen: null, peekShut: null, r };
  for (const s of [-1, 1]) {
    const pivot = onFace(new THREE.Group(), r, s * r * 0.36, r * 0.04, 0);
    if (eyes === 'open') pivot.add(openEye(r, dark, white, rig));
    else {
      const arc = closedEye(r, dark, eyes);
      pivot.add(arc);
      if (peek && s === 1) {
        const eye = openEye(r, dark, white, null);
        eye.visible = false;
        pivot.add(eye);
        rig.peekOpen = eye;
        rig.peekShut = arc;
      }
    }
    rig.blinkers.push(pivot);
    head.add(pivot);
  }

  const nose = onFace(solid(new THREE.SphereGeometry(r * 0.075, 16, 12), inner), r, 0, -r * 0.14, 0);
  nose.scale.set(1.4, 0.9, 0.8);
  head.add(nose);

  for (const s of [-1, 1]) {
    const mouth = onFace(solid(new THREE.TorusGeometry(r * 0.06, r * 0.022, 6, 16, Math.PI), dark), r, s * r * 0.06, -r * 0.25, 0);
    mouth.rotateZ(Math.PI);
    head.add(mouth);
  }

  const whiskerMat = clay(CAT.white);
  for (const s of [-1, 1]) {
    for (const k of [-1, 0, 1]) {
      const len = r * 0.62;
      const ax = s * r * 0.4;
      const ay = -r * 0.16 + k * r * 0.08;
      const az = Math.sqrt(Math.max(r * r - ax * ax - ay * ay, 0)) + r * 0.02;
      const w = solid(new THREE.CylinderGeometry(r * 0.009, r * 0.009, len, 4), whiskerMat);
      w.castShadow = false;
      const tilt = k * 0.16 * s;
      w.rotation.z = Math.PI / 2 + tilt;
      w.position.set(ax + s * (len / 2) * Math.cos(tilt), ay + s * (len / 2) * Math.sin(tilt), az);
      head.add(w);
    }
  }

  return { group: head, rig };
}

function openEye(r, dark, white, rig) {
  const eye = new THREE.Group();
  const ring = solid(new THREE.SphereGeometry(r * 0.19, 24, 16), white);
  ring.scale.z = 0.3;
  const pupil = new THREE.Group();
  const ball = solid(new THREE.SphereGeometry(r * 0.155, 24, 16), dark);
  ball.scale.z = 0.4;
  ball.position.z = r * 0.03;
  const shine = solid(new THREE.SphereGeometry(r * 0.045, 12, 8), white);
  shine.position.set(-r * 0.05, r * 0.05, r * 0.09);
  pupil.add(ball, shine);
  eye.add(ring, pupil);
  if (rig) rig.pupils.push(pupil);
  return eye;
}

function closedEye(r, dark, style) {
  const arc = solid(new THREE.TorusGeometry(r * 0.12, r * 0.04, 8, 24, Math.PI), dark);
  if (style === 'closed') arc.rotation.z = Math.PI; // ‿
  return arc;
}

function makeTail(points, r, mat, { phase = 0, sway = 0.18 } = {}) {
  const base = points.map((p) => new THREE.Vector3(...p));
  const group = new THREE.Group();
  const tube = solid(new THREE.BufferGeometry(), mat);
  const tip = solid(new THREE.SphereGeometry(r, 16, 12), mat);
  group.add(tube, tip);
  const pts = base.map((p) => p.clone());
  function update(t, amp = 1) {
    base.forEach((p, i) => {
      const k = i / (base.length - 1);
      const w = k * k * amp * sway;
      pts[i].set(
        p.x + Math.sin(t * 1.6 + phase - i * 0.6) * w,
        p.y + Math.sin(t * 1.1 + phase - i * 0.4) * w * 0.4,
        p.z + Math.cos(t * 1.3 + phase - i * 0.6) * w * 0.7,
      );
    });
    tube.geometry.dispose();
    tube.geometry = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 40, r, 10, false);
    tip.position.copy(pts[pts.length - 1]);
  }
  update(0);
  return { group, update };
}

function makeCapsule(r, len, mat, pos, rot = [0, 0, 0], scale = [1, 1, 1]) {
  const m = solid(new THREE.CapsuleGeometry(r, len, 10, 24), mat);
  m.position.set(...pos);
  m.rotation.set(...rot);
  m.scale.set(...scale);
  return m;
}

function buildCats() {
  const root = new THREE.Group();
  const stack = new THREE.Group();
  stack.position.y = -1.9;
  root.add(stack);

  const mat = {
    grey: clay(CAT.grey),
    orange: clay(CAT.orange),
    pink: clay(CAT.pink),
    inner: clay(CAT.inner),
  };

  // Grey: lying flat at the bottom, head on the right, asleep.
  const grey = new THREE.Group();
  grey.name = 'grey';
  const greyBody = makeCapsule(0.62, 1.5, mat.grey, [-0.45, 0.6, 0], [0, 0, Math.PI / 2], [0.9, 1, 1.05]);
  const greyHead = makeHead(0.78, CAT.grey, 'closed', { peek: true });
  greyHead.group.position.set(0.85, 0.8, 0.6);
  greyHead.group.rotation.set(0.06, -0.08, -0.05);
  const greyTail = makeTail(
    [[-1.3, 0.85, -0.15], [-1.75, 1.25, -0.2], [-2.05, 1.8, -0.2], [-2.0, 2.2, -0.15], [-2.25, 2.3, -0.1]],
    0.13, mat.grey, { phase: 0, sway: 0.14 },
  );
  grey.add(greyBody, greyHead.group, greyTail.group);
  for (const p of [[0.45, 0.2, 0.62], [-0.2, 0.2, 0.68], [-1.45, 0.2, 0.5]]) {
    grey.add(makeCapsule(0.2, 0.3, mat.grey, p, [Math.PI / 2, 0, 0]));
  }

  // Orange: lying on the grey cat, head front left, paws draped forward, tail up on the right.
  const orange = new THREE.Group();
  orange.name = 'orange';
  const orangeBody = makeCapsule(0.5, 1.3, mat.orange, [0.25, 1.55, -0.2], [0, 0, Math.PI / 2 - 0.1], [0.92, 1, 1]);
  const orangeHead = makeHead(0.7, CAT.orange, 'open');
  orangeHead.group.position.set(-0.55, 2.15, 0.35);
  orangeHead.group.rotation.set(0.05, 0.12, 0.05);
  const orangeTail = makeTail(
    [[0.9, 1.7, -0.25], [1.35, 2.0, -0.35], [1.65, 2.5, -0.35], [1.62, 2.9, -0.3], [1.45, 3.05, -0.25]],
    0.12, mat.orange, { phase: 1.7, sway: 0.2 },
  );
  orange.add(orangeBody, orangeHead.group, orangeTail.group);
  orange.add(makeCapsule(0.18, 0.5, mat.orange, [-1.0, 1.28, 0.42], [0, 0.3, Math.PI / 2]));
  orange.add(makeCapsule(0.18, 0.5, mat.orange, [-0.45, 1.22, 0.62], [0, 0.2, Math.PI / 2]));

  // Pink: sitting at the back, head top right, waving with its left paw.
  const pink = new THREE.Group();
  pink.name = 'pink';
  const pinkBody = solid(new THREE.SphereGeometry(0.62, 40, 28), mat.pink);
  pinkBody.position.set(0.55, 2.45, -0.6);
  pinkBody.scale.set(1, 1.25, 0.95);
  const pinkHead = makeHead(0.78, CAT.pink, 'happy');
  pinkHead.group.position.set(0.6, 3.4, -0.4);
  const arm = new THREE.Group();
  arm.position.set(0.05, 2.8, -0.35);
  arm.add(makeCapsule(0.17, 0.55, mat.pink, [0, 0.4, 0]));
  const paw = solid(new THREE.SphereGeometry(0.22, 24, 16), mat.pink);
  paw.position.set(0, 0.8, 0);
  const bean = solid(new THREE.SphereGeometry(0.1, 16, 12), mat.inner);
  bean.scale.z = 0.4;
  bean.position.set(0, 0.76, 0.2);
  arm.add(paw, bean);
  for (const [x, y] of [[-0.1, 0.9], [0, 0.95], [0.1, 0.9]]) {
    const toe = solid(new THREE.SphereGeometry(0.045, 12, 8), mat.inner);
    toe.scale.z = 0.5;
    toe.position.set(x, y, 0.18);
    arm.add(toe);
  }
  // Tail: out of the back of the body on the viewer's right, behind and outside the orange
  // tail, curling up beside the head.
  const pinkTail = makeTail(
    [[0.95, 1.95, -1.0], [1.5, 2.05, -1.2], [1.95, 2.5, -1.25], [2.05, 3.05, -1.15], [1.85, 3.35, -1.0]],
    0.13, mat.pink, { phase: 3.4, sway: 0.17 },
  );
  pink.add(pinkBody, pinkHead.group, arm, pinkTail.group);

  stack.add(grey, orange, pink);

  // Anchor for the floating "z Z" above the grey cat's head.
  const zzAnchor = new THREE.Object3D();
  zzAnchor.position.set(1.4, 1.75, 0.6);
  grey.add(zzAnchor);

  const blinkers = [
    { rig: orangeHead.rig, next: 2.2, t: -1 },
    { rig: pinkHead.rig, next: 3.4, t: -1 },
  ];
  const look = { from: new THREE.Vector2(), to: new THREE.Vector2(), t: 1, next: 1.2 };
  const react = { grey: -9, orange: -9, pink: -9 };
  let clock = 0;

  function update(t, dt) {
    clock = t;
    // Grey: slow breathing, tail barely moving; opens one eye for a moment when clicked.
    const breath = Math.sin(t * 1.4);
    greyBody.scale.x = 0.9 + breath * 0.03;
    greyHead.group.position.y = 0.8 + breath * 0.015;
    greyTail.update(t, 0.6);
    const peeking = t - react.grey < 1.6;
    greyHead.rig.peekOpen.visible = peeking;
    greyHead.rig.peekShut.visible = !peeking;

    // Orange: eyes dart around, tail sways.
    orangeTail.update(t, 1);
    look.next -= dt;
    if (look.next <= 0) {
      look.from.copy(look.to);
      const r = orangeHead.rig.r;
      look.to.set((Math.random() * 2 - 1) * r * 0.06, (Math.random() * 2 - 1) * r * 0.04);
      look.t = 0;
      look.next = 1 + Math.random() * 1.8;
    }
    look.t = Math.min(1, look.t + dt * 8);
    for (const p of orangeHead.rig.pupils) {
      p.position.x = THREE.MathUtils.lerp(look.from.x, look.to.x, look.t);
      p.position.y = THREE.MathUtils.lerp(look.from.y, look.to.y, look.t);
    }
    const startled = t - react.orange < 0.9 ? 1.25 : 1;
    for (const e of orangeHead.rig.blinkers) e.scale.x = THREE.MathUtils.lerp(e.scale.x, startled, 0.2);

    // Pink: waves (faster when clicked), head tilts.
    const excited = t - react.pink < 1.2;
    arm.rotation.z = 0.55 + Math.sin(t * (excited ? 11 : 5.5)) * (excited ? 0.45 : 0.32);
    pinkHead.group.rotation.z = Math.sin(t * 1.2) * 0.06;
    pinkTail.update(t, excited ? 1.6 : 0.9);

    // Blinks, out of sync.
    for (const b of blinkers) {
      b.next -= dt;
      if (b.next <= 0 && b.t < 0) b.t = 0;
      let s = 1;
      if (b.t >= 0) {
        b.t += dt / 0.18;
        s = 1 - Math.sin(Math.min(b.t, 1) * Math.PI) * 0.92;
        if (b.t >= 1) { b.t = -1; b.next = 2.5 + Math.random() * 3; }
      }
      for (const e of b.rig.blinkers) e.scale.y = s;
    }
  }

  function poke(name) { react[name] = clock; }

  // Wireframe swaps in low-poly copies: at ASCII resolution the full meshes have so many
  // lines per cell that they read as solid.
  function setWireframe(on) {
    root.traverse((o) => {
      if (!o.material) return;
      o.material.wireframe = on;
      if (!o.isMesh) return;
      if (on && !o.userData.fine) {
        if (o.userData.coarse === undefined) o.userData.coarse = coarse(o.geometry);
        if (o.userData.coarse) { o.userData.fine = o.geometry; o.geometry = o.userData.coarse; }
      } else if (!on && o.userData.fine) {
        o.geometry = o.userData.fine;
        o.userData.fine = null;
      }
    });
  }

  return { root, cats: { grey, orange, pink }, zzAnchor, update, poke, setWireframe };
}

// A low-poly copy of a sphere, capsule or cone, for the wireframe view; null for the rest.
function coarse(geo) {
  const p = geo.parameters;
  if (geo.type === 'SphereGeometry') {
    const big = p.radius > 0.3;
    return new THREE.SphereGeometry(p.radius, big ? 14 : 8, big ? 9 : 6);
  }
  if (geo.type === 'CapsuleGeometry') return new THREE.CapsuleGeometry(p.radius, p.length, 3, 10);
  if (geo.type === 'ConeGeometry') return new THREE.ConeGeometry(p.radius, p.height, 8);
  return null;
}

// Walk up from a raycast hit to the cat it belongs to.
function catNameOf(obj) {
  for (let o = obj; o; o = o.parent) if (['grey', 'orange', 'pink'].includes(o.name)) return o.name;
  return null;
}

// Background music: an original darkwave loop, synthesized live with the Web Audio API.
// No samples, no files. SFX.toggle starts and stops it; go() calls MUSIC.stage(n).
//
//   MUSIC.start(ac)   build the graph on ac, fade in over ~2s from bar 1
//   MUSIC.stop()      fade out over 0.5s, then stop scheduling and tear the graph down
//   MUSIC.stage(n)    a short filter swell on a stage change (no-op while silent)
//   MUSIC.stats()     voices live and played, position and state, for console checks
//
// D minor, 92 BPM, 16th-note grid. The 8-bar progression Dm Dm Bb Bb Gm Gm Eb A plays four
// times as a 32-bar loop:
//   bars  1–8   intro      pad, sub bass, 8th-note arp behind a closed filter, hats creep in
//   bars  9–16  build      arp goes to 16ths and opens, pulse bass, kick, offbeat hats
//   bars 17–24  full       snare, 8th hats and a slow lead line through the echo
//   bars 25–32  breakdown  drums thin out, the filter closes back to where bar 1 starts
// The arp filter's cutoff ends the loop where it began, so the loop point is seamless.
//
// Notes are scheduled ahead on AudioContext time (lookahead scheduler); the interval timer
// only decides when to look ahead. Every note voice disconnects itself when it ends.
const MUSIC_BPM = 92;
const MUSIC_STEP = 60 / MUSIC_BPM / 4;
const MUSIC_BARS = 32;
const MUSIC_LEVEL = 0.13; // master level: about 9 dB under the SFX bleeps (RMS)
const MUSIC_LOOKAHEAD = 0.15;

const MUSIC_CHORDS = {
  Dm: { root: 38, pad: [57, 62, 65], arp: [62, 65, 69, 72, 76] },
  Bb: { root: 34, pad: [58, 62, 65], arp: [58, 62, 65, 69, 72] },
  Gm: { root: 31, pad: [58, 62, 67], arp: [55, 62, 65, 70, 74] },
  Eb: { root: 39, pad: [58, 63, 67], arp: [58, 63, 67, 70, 74] },
  A: { root: 33, pad: [57, 61, 64], arp: [57, 61, 64, 67, 69] },
};
const MUSIC_PROG = ['Dm', 'Dm', 'Bb', 'Bb', 'Gm', 'Gm', 'Eb', 'A'];
const MUSIC_ARP = [0, 2, 4, 1, 3, 2, 4, 3]; // index into the chord's arp tones, per 16th
// Lead line for the full section: [bar in cycle, step, midi, length in 16ths]
const MUSIC_LEAD = [
  [0, 0, 81, 8], [0, 8, 77, 4], [0, 12, 76, 4], [1, 0, 74, 14],
  [2, 0, 77, 8], [2, 8, 79, 8], [3, 0, 86, 14],
  [4, 0, 82, 8], [4, 8, 81, 4], [4, 12, 79, 4], [5, 0, 77, 14],
  [6, 0, 75, 8], [6, 8, 79, 8], [7, 0, 85, 16],
];
// Arp cutoff (Hz) at bar starts; log-interpolated between, with a slow 4-bar wobble.
const MUSIC_CUTOFF = [[0, 320], [8, 650], [16, 1700], [20, 2700], [24, 2200], [32, 320]];

function musicMtof(m) { return 440 * 2 ** ((m - 69) / 12); }

function musicCutoff(bar) {
  const b = ((bar % MUSIC_BARS) + MUSIC_BARS) % MUSIC_BARS;
  let i = 0;
  while (MUSIC_CUTOFF[i + 1][0] <= b) i++;
  const [b0, f0] = MUSIC_CUTOFF[i];
  const [b1, f1] = MUSIC_CUTOFF[i + 1];
  const f = f0 * (f1 / f0) ** ((b - b0) / (b1 - b0));
  return f * (1 + 0.14 * Math.sin((b / 4) * Math.PI * 2));
}

// One synth engine on one AudioContext (or OfflineAudioContext). sched(step, t) plays a 16th.
function musicEngine(ac, out) {
  const nodes = [];
  const keep = (n) => (nodes.push(n), n);
  const gain = (v) => { const g = keep(ac.createGain()); g.gain.value = v; return g; };
  const filter = (type, f, q = 0.7) => {
    const b = keep(ac.createBiquadFilter());
    b.type = type; b.frequency.value = f; b.Q.value = q;
    return b;
  };
  const stats = { live: 0, played: 0 };

  // Shared noise and a dark synthetic reverb impulse.
  const noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
  { const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const irLen = Math.floor(ac.sampleRate * 2.8);
  const ir = ac.createBuffer(2, irLen, ac.sampleRate);
  for (let c = 0; c < 2; c++) {
    const d = ir.getChannelData(c);
    let y = 0;
    for (let i = 0; i < irLen; i++) {
      y += (Math.random() * 2 - 1 - y) * 0.3; // one-pole lowpass: a darker tail
      d[i] = y * (1 - i / irLen) ** 2.5;
    }
  }

  // Master: comp -> fade -> out
  const comp = keep(ac.createDynamicsCompressor());
  comp.threshold.value = -18; comp.ratio.value = 4; comp.attack.value = 0.01; comp.release.value = 0.25;
  const master = gain(0);
  comp.connect(master).connect(out);

  const rev = keep(ac.createConvolver());
  rev.buffer = ir;
  const revIn = gain(1);
  revIn.connect(rev).connect(gain(0.8)).connect(comp);

  // Two feedback echoes, dotted 8th left and quarter right, darkening on each repeat.
  const delayIn = gain(1);
  for (const [steps, pan] of [[3, -0.55], [4, 0.55]]) {
    const dl = keep(ac.createDelay(2));
    dl.delayTime.value = steps * MUSIC_STEP;
    const fb = gain(0.42);
    const tone = filter('lowpass', 1600);
    const p = keep(ac.createStereoPanner());
    p.pan.value = pan;
    delayIn.connect(dl);
    dl.connect(tone).connect(fb).connect(dl);
    tone.connect(p).connect(comp);
  }

  // Layer buses. Voices feed the filters; the filters are shared, so one sweep moves them all.
  const bus = (dry, toDelay, toRev) => {
    const g = gain(dry);
    g.connect(comp);
    if (toDelay) g.connect(gain(toDelay)).connect(delayIn);
    if (toRev) g.connect(gain(toRev)).connect(revIn);
    return g;
  };
  const arpF = filter('lowpass', musicCutoff(0), 7);
  arpF.connect(bus(1, 0.38, 0.25));
  const padF = filter('lowpass', 1000, 0.6);
  padF.connect(bus(1, 0, 0.7));
  const padLfo = keep(ac.createOscillator());
  padLfo.frequency.value = 0.055;
  padLfo.connect(gain(380)).connect(padF.frequency);
  padLfo.start();
  const bassF = filter('lowpass', 420, 3);
  bassF.connect(bus(1, 0, 0));
  const subOut = bus(1, 0, 0);
  const leadF = filter('lowpass', 2300, 1.5);
  leadF.connect(bus(1, 0.55, 0.45));
  const drums = bus(1, 0, 0.12);
  const drumsWet = bus(0.5, 0, 1); // snare and swells: mostly reverb

  // A voice: oscillators [type, freq, detune] into one envelope gain into dest.
  function voice(oscs, t, end, dest) {
    const env = ac.createGain();
    env.gain.value = 0;
    env.connect(dest);
    const os = oscs.map(([type, f, det = 0]) => {
      const o = ac.createOscillator();
      o.type = type; o.frequency.value = f; o.detune.value = det;
      o.connect(env);
      o.start(t); o.stop(end);
      return o;
    });
    stats.live++; stats.played++;
    os[0].onended = () => { for (const o of os) o.disconnect(); env.disconnect(); stats.live--; };
    return { env: env.gain, osc: os };
  }
  // A noise burst: noise -> filter -> envelope -> dest.
  function noiseVoice(type, f, q, t, end, dest) {
    const src = ac.createBufferSource();
    src.buffer = noise; src.loop = true;
    const bf = ac.createBiquadFilter();
    bf.type = type; bf.frequency.value = f; bf.Q.value = q;
    const env = ac.createGain();
    env.gain.value = 0;
    src.connect(bf).connect(env).connect(dest);
    src.start(t, Math.random() * 0.5); src.stop(end);
    stats.live++; stats.played++;
    src.onended = () => { src.disconnect(); bf.disconnect(); env.disconnect(); stats.live--; };
    return { env: env.gain, freq: bf.frequency };
  }

  function arp(t, m, level) {
    const v = voice([['sawtooth', musicMtof(m), -4], ['square', musicMtof(m), 5]], t, t + 0.4, arpF);
    v.env.setValueAtTime(0, t);
    v.env.linearRampToValueAtTime(level, t + 0.004);
    v.env.setTargetAtTime(0, t + 0.01, 0.07);
  }
  function pad(t, notes, dur, level) {
    for (const m of notes) {
      const v = voice([['sawtooth', musicMtof(m), -9], ['sawtooth', musicMtof(m), 8]], t, t + dur + 1.8, padF);
      v.env.setValueAtTime(0, t);
      v.env.linearRampToValueAtTime(level, t + 1.1);
      v.env.setValueAtTime(level, t + dur);
      v.env.linearRampToValueAtTime(0, t + dur + 1.6);
    }
  }
  function sub(t, m, dur, level) {
    const v = voice([['sine', musicMtof(m)]], t, t + dur + 0.4, subOut);
    v.env.setValueAtTime(0, t);
    v.env.linearRampToValueAtTime(level, t + 0.06);
    v.env.setValueAtTime(level, t + dur - 0.05);
    v.env.linearRampToValueAtTime(0, t + dur + 0.3);
  }
  function pulse(t, m, level) {
    const v = voice([['sawtooth', musicMtof(m)], ['square', musicMtof(m - 12), 3]], t, t + 0.3, bassF);
    v.env.setValueAtTime(0, t);
    v.env.linearRampToValueAtTime(level, t + 0.005);
    v.env.setTargetAtTime(0, t + 0.02, 0.06);
  }
  let leadPrev = 0;
  function lead(t, m, dur) {
    const f = musicMtof(m);
    const v = voice([['triangle', f], ['square', f, 7]], t, t + dur + 0.5, leadF);
    if (leadPrev) for (const o of v.osc) { o.frequency.setValueAtTime(leadPrev, t); o.frequency.setTargetAtTime(f, t, 0.035); }
    leadPrev = f;
    v.env.setValueAtTime(0, t);
    v.env.linearRampToValueAtTime(0.07, t + 0.06);
    v.env.setTargetAtTime(0.045, t + 0.06, 0.4);
    v.env.setValueAtTime(0.045, t + dur);
    v.env.linearRampToValueAtTime(0, t + dur + 0.35);
  }
  function kick(t, level) {
    const v = voice([['sine', 140]], t, t + 0.4, drums);
    v.osc[0].frequency.setValueAtTime(140, t);
    v.osc[0].frequency.exponentialRampToValueAtTime(42, t + 0.11);
    v.env.setValueAtTime(level, t);
    v.env.exponentialRampToValueAtTime(0.001, t + 0.36);
  }
  function snare(t) {
    // Gated: the noise holds flat, then cuts, like an 80s gated reverb.
    const n = noiseVoice('bandpass', 1700, 0.7, t, t + 0.25, drumsWet);
    n.env.setValueAtTime(0.32, t);
    n.env.setValueAtTime(0.32, t + 0.16);
    n.env.linearRampToValueAtTime(0, t + 0.2);
    const v = voice([['triangle', 190]], t, t + 0.15, drums);
    v.env.setValueAtTime(0.18, t);
    v.env.exponentialRampToValueAtTime(0.001, t + 0.12);
  }
  function hat(t, level) {
    const n = noiseVoice('highpass', 7500, 0.8, t, t + 0.08, drums);
    n.env.setValueAtTime(level, t);
    n.env.exponentialRampToValueAtTime(0.001, t + 0.05);
  }
  function swell(t, dur) {
    const n = noiseVoice('bandpass', 300, 2, t, t + dur + 0.05, drumsWet);
    n.freq.setValueAtTime(300, t);
    n.freq.exponentialRampToValueAtTime(5000, t + dur);
    n.env.setValueAtTime(0, t);
    n.env.linearRampToValueAtTime(0.1, t + dur * 0.95);
    n.env.linearRampToValueAtTime(0, t + dur);
  }

  function sched(step, t) {
    const bar = Math.floor(step / 16) % MUSIC_BARS;
    const s = step % 16;
    const sec = bar >> 3; // 0 intro, 1 build, 2 full, 3 breakdown
    const cb = bar % 8;
    const chord = MUSIC_CHORDS[MUSIC_PROG[cb]];
    const bar16 = 16 * MUSIC_STEP;

    if (s === 0) {
      // Arp cutoff: ramp across the bar toward next bar's value.
      arpF.frequency.setValueAtTime(musicCutoff(bar), t);
      arpF.frequency.linearRampToValueAtTime(musicCutoff(bar + 1), t + bar16);
      // Pad and sub on chord changes, held until the next change.
      if (MUSIC_PROG[cb] !== MUSIC_PROG[(cb + 7) % 8]) {
        let len = 1;
        while (cb + len < 8 && MUSIC_PROG[cb + len] === MUSIC_PROG[cb]) len++;
        pad(t, chord.pad, len * bar16, sec === 3 ? 0.03 : 0.022);
        sub(t, chord.root, len * bar16, sec === 0 ? 0.2 : sec === 3 ? 0.24 : 0.16);
      }
      if (bar === 7 || bar === 15) swell(t, bar16);
    }

    // Arp: 8ths in the intro, 16ths after.
    if (sec > 0 || s % 2 === 0) {
      const lvl = [0.05, 0.065, 0.07, 0.055][sec] * (s % 4 === 0 ? 1.15 : 1);
      arp(t, chord.arp[MUSIC_ARP[s % 8]], lvl);
    }
    // Pulse bass in build and full.
    if ((sec === 1 || sec === 2) && s % 2 === 0) pulse(t, chord.root + 12, s % 4 === 0 ? 0.09 : 0.065);
    // Lead in full.
    if (sec === 2) for (const [lb, ls, m, len] of MUSIC_LEAD) if (lb === cb && ls === s) lead(t, m, len * MUSIC_STEP);
    // Drums.
    if (sec === 1 && (s === 0 || s === 8)) kick(t, 0.55);
    if (sec === 2 && (s === 0 || s === 8 || s === 10)) kick(t, 0.6);
    if (sec === 3 && s === 0 && cb % 2 === 0 && cb < 6) kick(t, 0.45);
    if (sec === 2 && (s === 4 || s === 12)) snare(t);
    if (bar === 15 && s === 12) snare(t);
    if (sec === 1 && s % 4 === 2) hat(t, 0.05);
    if (sec === 2 && s % 2 === 0) hat(t, s % 4 === 2 ? 0.06 : 0.03);
    if (sec === 0 && cb >= 6 && s % 4 === 2) hat(t, 0.025);
  }

  // A stage-change swell: open the arp and pad filters for a moment.
  function stage(t) {
    for (const p of [arpF.detune, padF.detune]) {
      p.cancelScheduledValues(t);
      p.setValueAtTime(p.value, t);
      p.linearRampToValueAtTime(1400, t + 0.35);
      p.setTargetAtTime(0, t + 0.35, 0.9);
    }
  }

  function dispose() {
    padLfo.stop();
    for (const n of nodes) n.disconnect();
  }

  return { sched, stage, dispose, master: master.gain, stats };
}

const MUSIC = {
  ac: null,
  engine: null,
  timer: 0,
  stopTimer: 0,
  step: 0,
  next: 0,
  playing: false,

  start(ac) {
    this.ac = ac;
    if (this.stopTimer) { clearTimeout(this.stopTimer); this.stopTimer = 0; }
    if (!this.engine || this.engine.ac !== ac) {
      this.engine = musicEngine(ac, ac.destination);
      this.engine.ac = ac;
      this.step = 0;
      this.next = ac.currentTime + 0.1;
      this.timer = setInterval(() => this.tick(), 25);
    }
    const g = this.engine.master;
    const now = ac.currentTime;
    g.cancelScheduledValues(now);
    g.setValueAtTime(g.value, now);
    g.linearRampToValueAtTime(MUSIC_LEVEL, now + 2);
    this.playing = true;
    this.tick();
  },

  stop() {
    if (!this.engine || !this.playing) return;
    this.playing = false;
    const g = this.engine.master;
    const now = this.ac.currentTime;
    g.cancelScheduledValues(now);
    g.setValueAtTime(g.value, now);
    g.linearRampToValueAtTime(0, now + 0.5);
    this.stopTimer = setTimeout(() => {
      this.stopTimer = 0;
      clearInterval(this.timer);
      this.timer = 0;
      this.engine.dispose();
      this.engine = null;
    }, 650);
  },

  tick() {
    const e = this.engine;
    if (!e) return;
    const now = this.ac.currentTime;
    // Fell behind (a throttled tab): skip ahead on the grid instead of a burst of notes.
    while (this.next < now) { this.next += MUSIC_STEP; this.step = (this.step + 1) % (MUSIC_BARS * 16); }
    while (this.next < now + MUSIC_LOOKAHEAD) {
      e.sched(this.step, this.next);
      this.next += MUSIC_STEP;
      this.step = (this.step + 1) % (MUSIC_BARS * 16);
    }
  },

  stage() {
    if (this.playing && this.engine) this.engine.stage(this.ac.currentTime);
  },

  stats() {
    const e = this.engine;
    return {
      playing: this.playing, state: this.ac?.state ?? 'none', bar: Math.floor(this.step / 16) + 1,
      live: e ? e.stats.live : 0, played: e ? e.stats.played : 0, level: e ? +e.master.value.toFixed(3) : 0,
    };
  },
};

// Game shell pieces shared by every stage. Stages register themselves in stage-N-*.js as
// STAGES[n] = (ctx) => stage; game.js boots the game.
//
// Stage contract — the factory gets ctx and returns:
//   scene, camera          THREE.Scene and THREE.PerspectiveCamera, rendered through the ASCII pass
//   enter(), exit()        optional; called when the stage becomes active or inactive
//   update(t, dt)          optional; t is seconds since this stage was entered
//   onKey(e) -> bool       optional; return true if the stage used the key (shell skips its own handling)
//   hud() -> {tl,tr,bl,br} optional; HUD text overrides (top left/right, bottom left/right)
//   swipe                  optional; set false if the stage uses horizontal drags (orbit), so a
//                          touch swipe doesn't change stage. Elements with data-no-swipe opt out too.
// ctx gives: renderer, ascii (AsciiPass), layer (this stage's DOM layer, visible only while
// active; attach pointer handlers here), setAscii({cell, mode, fill, edges, ridges}), sfx(name),
// go(n), next(), back(), score (object shared across stages), fps() (smoothed frames per
// second, for HUD counters).
//
// Transitions: go/next/back play a ~700ms transition. The outgoing layer's text and the HUD
// scramble into random characters, a warp star field flies past, then the incoming layer's
// text resolves. enter() runs about 500ms in, so update(t) starts while the text resolves.
// Text inside an element with data-no-scramble is left alone. Calls to go() during a
// transition are queued, so a stage never needs to guard against them.
//
// setAscii options reset to ASCII_DEFAULTS on every stage change; call it in enter().
//   ridges: true draws thin bright lines (grids, streaks, line art) as | / - \ along the line.
const STAGES = [];
const STAGE_COUNT = 5;

const PALETTE = {
  ink: 0xf4ecdf,
  hot: 0xff3d8b,
  cyan: 0x4be3f0,
  gold: 0xffc53d,
  orange: 0xff8a3d,
  violet: 0x9b5cff,
};

const ASCII_DEFAULTS = { cell: 12, mode: 0, fill: 0.4, edges: true, ridges: false };

// A box of colored star specks. Each star snaps to one ASCII cell and draws as one glyph,
// whatever the pixel ratio. Stars don't write depth, so they never trigger edge glyphs.
//   brightness    linear color scale; 0.4 lands most stars on . : - + * rather than # @
//   twinkle 0..1  how much each star dims and brightens over time
//   drift         units per second the field streams toward +z (toward a default camera)
//   wrap          keep the field around the camera along z, so a flying camera never runs out
//                 (on whenever drift is set)
function makeStars({
  count = 700, spread = 160, depth = 200, twinkle = 0.35, drift = 0, wrap = false, brightness = 0.4,
  colors = [PALETTE.ink, PALETTE.cyan, PALETTE.hot, PALETTE.gold],
} = {}) {
  const pos = new Float32Array(count * 3);
  const col = new Float32Array(count * 3);
  const phase = new Float32Array(count);
  const c = new THREE.Color();
  for (let i = 0; i < count; i++) {
    pos[i * 3] = (Math.random() - 0.5) * spread;
    pos[i * 3 + 1] = (Math.random() - 0.5) * spread;
    pos[i * 3 + 2] = -Math.random() * depth;
    c.set(colors[i % colors.length]).multiplyScalar(brightness * (0.5 + Math.random() * 0.5));
    col.set([c.r, c.g, c.b], i * 3);
    phase[i] = Math.random();
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  geo.setAttribute('phase', new THREE.BufferAttribute(phase, 1));
  const uniforms = {
    uTime: { value: 0 },
    uTwinkle: { value: twinkle },
    uDrift: { value: drift },
    uDepth: { value: depth },
    uWrap: { value: wrap || drift !== 0 ? 1 : 0 },
    uCam: { value: new THREE.Vector3() },
    uRes: { value: new THREE.Vector2(1, 1) },
    uCell: { value: 2 },
  };
  const mat = new THREE.ShaderMaterial({
    uniforms,
    transparent: true,
    depthWrite: false,
    vertexShader: /* glsl */ `
      attribute vec3 color;
      attribute float phase;
      uniform float uTime, uTwinkle, uDrift, uDepth, uWrap, uCell;
      uniform vec3 uCam;
      uniform vec2 uRes;
      varying vec3 vColor;
      void main() {
        vec3 p = position;
        float fade = 1.0;
        if (uWrap > 0.5) {
          p.z += uDrift * uTime;
          p.z = uCam.z - mod(uCam.z - p.z, uDepth);
          fade = smoothstep(0.0, 0.15, (p.z - (uCam.z - uDepth)) / uDepth);
        }
        gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
        // Snap to the center of an ASCII cell and cover exactly that cell.
        vec2 cells = uRes / uCell;
        vec2 ndc = gl_Position.xy / gl_Position.w;
        vec2 snapped = (floor((ndc * 0.5 + 0.5) * cells) + 0.5) / cells;
        gl_Position.xy = (snapped * 2.0 - 1.0) * gl_Position.w;
        gl_PointSize = uCell;
        float tw = 1.0 - uTwinkle * (0.5 + 0.5 * sin(uTime * (1.2 + phase * 2.5) + phase * 6.2832));
        vColor = color * tw * fade;
      }`,
    fragmentShader: /* glsl */ `
      varying vec3 vColor;
      void main() { gl_FragColor = vec4(vColor, 1.0); }`,
  });
  const points = new THREE.Points(geo, mat);
  points.frustumCulled = false;
  const res = new THREE.Vector2();
  points.onBeforeRender = (r, scene, camera) => {
    const rt = r.getRenderTarget();
    if (rt) uniforms.uRes.value.set(rt.width, rt.height);
    else uniforms.uRes.value.copy(r.getDrawingBufferSize(res));
    uniforms.uCell.value = rt ? 2 : 1;
    uniforms.uTime.value = performance.now() / 1000;
    points.worldToLocal(camera.getWorldPosition(uniforms.uCam.value));
  };
  return points;
}

function el(tag, className = '', html = '') {
  const e = document.createElement(tag);

// Scramble: swap a share of a string's characters for random glyphs. Each character has its
// own threshold, so as amount goes 0 -> 1 the noise spreads across the text.
const SCRAMBLE_GLYPHS = '!#$%&*+=?@<>/\\|~^:;01ABCDEFGHJKLMNPRSTUVXYZ░▒▓█';
function scrambleText(s, amount, seed = 0) {
  if (amount <= 0 || !s) return s;
  let out = '';
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    const th = Math.abs(Math.sin((i + 1) * 12.9898 + seed * 78.233) * 43758.5453) % 1;
    if (ch === ' ' || ch === '\n' || ch === ' ' || th >= amount) out += ch;
    else out += SCRAMBLE_GLYPHS[(Math.random() * SCRAMBLE_GLYPHS.length) | 0];
  }
  return out;
}

// toggling also starts and stops the background music (music.js).
const SFX = {
  on: false,
  ac: null,
  notes: {
    coin: [[988, 0.07], [1319, 0.25]],
    next: [[660, 0.06], [880, 0.08]],
    back: [[880, 0.06], [660, 0.08]],
    blip: [[1200, 0.04]],
    select: [[523, 0.05], [784, 0.07]],
    type: [[1800, 0.015]],
    meow: [[700, 0.08], [900, 0.12], [600, 0.14]],
    warp: [[196, 0.04], [262, 0.04], [349, 0.04], [466, 0.04], [622, 0.05]],
  },
  toggle() {
    this.on = !this.on;
    if (this.on && !this.ac) this.ac = new AudioContext();
    if (this.on && this.ac.state === 'suspended') this.ac.resume();
    if (this.on) this.play('select');
    if (this.on) MUSIC.start(this.ac);
    else MUSIC.stop();
    return this.on;
  },
  play(name) {
    if (!this.on || !this.ac || !this.notes[name]) return;
    let at = this.ac.currentTime;
    const soft = name === 'warp' || name === 'type';
    for (const [f, d] of this.notes[name]) {
      const o = this.ac.createOscillator();
      const g = this.ac.createGain();
      o.type = name === 'meow' || name === 'warp' ? 'triangle' : 'square';
      o.frequency.setValueAtTime(f, at);
      g.gain.setValueAtTime(soft ? 0.035 : 0.06, at);
      g.gain.exponentialRampToValueAtTime(0.0001, at + d);
      o.connect(g).connect(this.ac.destination);
      o.start(at);
      o.stop(at + d);
      at += d;
    }
  },
};
